[[scenario]]
id = "S28"
title = "A family is given exactly one folder and nothing else"
category = "sharing"
covers = ["exactly-one-folder"]
rules = ["C21", "D6"]
given = "Ines and Tom are in the family group. Ines has the folder f1 with a sub-folder f1b, and a private folder f2. The tag t1 is on s1 (in f1) and on s4 (in f2); the tag t2 is on s3 (in f2) only. The image at1 is used by s2 (in f1b), the image at2 by s3. Ines shares f1 with the family, to use."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f1b", entity = "folder", profile = "p-ines", parent = "f1", rev = 4, fields = { name = "Returns" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 5, fields = { name = "Private" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 7, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "s2", entity = "snippet", folder = "f1b", rev = 8, fields = { abbreviation = ";rret", kind = "rich", body = "Label: ![label](attachment:sha-label)" } },
  { id = "s3", entity = "snippet", folder = "f2", rev = 9, fields = { abbreviation = ";iban", kind = "rich", body = "My account: ![card](attachment:sha-card)" } },
  { id = "s4", entity = "snippet", folder = "f2", rev = 10, fields = { abbreviation = ";home", body = "12 Millrace Lane" } },
  { id = "t1", entity = "tag", profile = "p-ines", rev = 11, fields = { name = "shop" } },
  { id = "t2", entity = "tag", profile = "p-ines", rev = 12, fields = { name = "money" } },
  { id = "l1", entity = "snippet_tag", snippet = "s1", tag = "t1", rev = 13 },
  { id = "l2", entity = "snippet_tag", snippet = "s3", tag = "t2", rev = 14 },
  { id = "l3", entity = "snippet_tag", snippet = "s4", tag = "t1", rev = 15 },
  { id = "at1", entity = "attachment", profile = "p-ines", rev = 16, fields = { sha256 = "sha-label" } },
  { id = "at2", entity = "attachment", profile = "p-ines", rev = 17, fields = { sha256 = "sha-card" } },
  { id = "la1", entity = "snippet_attachment", snippet = "s2", attachment = "at1", rev = 18 },

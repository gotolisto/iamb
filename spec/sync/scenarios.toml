[[scenario]]
id = "S85"
title = "A conflict does not hand a member a version from the owner's private folder"
category = "sharing"
covers = ["conflict-version-audience"]
rules = ["C3", "C20", "C21", "D2"]
given = "Ines shares f1 with the family, to change; f2 is private. Her two devices disagree about the snippet s2 in the private folder, and the conflict stays open. She then moves s2 into the shared folder. Tom edits it offline, Ines edits it once more, and Tom's edit arrives last."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 4, fields = { name = "Private" } },
  { id = "s2", entity = "snippet", folder = "f2", rev = 8, fields = { abbreviation = ";door", body = "The door code is 4711." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s2"
fields = { body = "The door code is 4711 until Friday, then 2468." }

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s2"
fields = { body = "Ask me for the door code." }

[[scenario.step]]
at = "A"
do = "online"
answers = { s2 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { s2 = "applied+conflict" }
note = "Ines's own conflict, in her private folder: b1 replaced a1 unseen. Nobody answers it."

[[scenario.step]]
id = "b2"
at = "B"
do = "move"
row = "s2"
to = "f1"
answers = { s2 = "applied" }
note = "The snippet, now harmless, goes into the shared folder. It becomes readable for Tom as b2 places it (C21). The move records no conflict, so the open one stays as it is, with a1 on offer (C3)."

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s2"
fields = { body = "Ask Ines for the door code." }

[[scenario.step]]
id = "a2"
at = "A"
do = "edit"
row = "s2"
fields = { body = "Ask me or Tom for the door code." }
answers = { s2 = "applied" }

[[scenario.step]]
at = "C"
do = "online"
answers = { s2 = "applied+conflict" }
note = "c1 replaces a2 unseen: a new conflict, which takes over a1 from the open one (C3). Tom is a party and is shown it. What it offers him is a2, the version his write replaced, which he could read while it was the row. a1 is not offered to him: it was written, and replaced, while the snippet was in a folder he could not read, and the conflict view and `Restore this version` treat it for him as a version that is not there (C20). Ines is offered both. Had Tom's device sent base 0 instead, as a changed client can, the answer would be the same."

[scenario.outcome]
summary = "The snippet has Tom's content. One conflict is open on it. Ines's devices offer her a2 and a1 back; Tom's device offers him a2 only. The door code that was in the snippet while it was private has reached no device of Tom's, in no form: not as a row, not as a version of a conflict, and not through a restore."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "f2", state = "live", version = "start" },
  { row = "s2", state = "live", version = "c1", fields = { folder = "f1" } },
  { row = "sh1", state = "live", version = "start" },
]
history = [
  { row = "s2", version = "start" },
  { row = "s2", version = "a1" },
  { row = "s2", version = "b1" },
  { row = "s2", version = "b2" },
  { row = "s2", version = "a2" },
]
conflicts = [
  { row = "s2", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "replaced" },
  { row = "s2", kind = "edit_edit", winner = "c1", loser = "a2", carried = ["a1"], parties = ["tom", "ines"], state = "open" },
]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.C]
same_as = "server"
rows = [{ row = "f2", state = "absent" }]
shown = ["conflict"]

[[scenario]]
id = "S86"
title = "A removed member is told of no conflict and can close none"
category = "membership"
covers = ["conflict-after-removal"]
rules = ["C3", "C16", "C20", "C21", "D6"]
given = "Ines shares f1 with the family, to change. Tom and Ines change the snippet s1 while offline; Ines's change arrives last, and the conflict offers Tom's version back to both of them. Then Ines removes Tom from the family."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s1"
fields = { body = "Open 9 to 6." }

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Open 10 to 5." }

[[scenario.step]]
at = "C"
do = "online"
answers = { s1 = "applied" }

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied+conflict" }
note = "a1 replaced c1 unseen. The conflict is shown to Ines and to Tom, who is a member and can read the row."

[[scenario.step]]
id = "x1"
at = "A"
do = "remove_member"
row = "m-tom"
answer = "ok"
note = "The removal ends Tom's access to the folder in the same transaction (G13). From that commit he takes no part in the conflict: his feed gets no entry about it, the list of conflicts is empty for him, the conflict answers `not_found`, and so does his `Keep the current version`, which before would have closed it for Ines as well (C20). His device purges the folder and what it showed about it (D6)."

[[scenario.step]]
id = "r1"
at = "B"
do = "resolve"
row = "s1"
choice = "restore"
answer = "ok"
note = "The version Tom wrote stays on offer to the people who can read the row: Ines restores it, as a new revision by her that keeps Tom as the author of its content (C17, C20). Tom's device hears nothing of it."

[scenario.outcome]
summary = "The snippet has the content Tom wrote, restored by Ines after he was removed. The conflict is resolved; it names Ines and Tom as its parties, the authors of its two versions, and from the removal on only Ines took part in it. Tom's device holds neither the folder nor the snippet, and learned nothing of what happened to them after the removal."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "deleted", version = "x1" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "r1", fields = { body = "Open 9 to 6." } },
  { row = "sh1", state = "live", version = "start" },
]
history = [
  { row = "m-tom", version = "start" },
  { row = "s1", version = "start" },
  { row = "s1", version = "c1" },
  { row = "s1", version = "a1" },
]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "a1", loser = "c1", parties = ["ines", "tom"], state = "resolved" }]

[scenario.outcome.device.A]
same_as = "server"
rows = [{ row = "m-tom", state = "absent" }]
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
rows = [{ row = "m-tom", state = "absent" }]
shown = ["conflict"]

[scenario.outcome.device.C]
rows = [
  { row = "m-ines", state = "absent" },
  { row = "m-tom", state = "deleted", version = "x1" },
  { row = "f1", state = "absent" },
  { row = "s1", state = "absent" },
  { row = "sh1", state = "absent" },
]
shown = ["conflict", "revoked"]
access = { f1 = "none" }

[[scenario]]
id = "S87"
title = "A member cannot restore a version that puts a folder where a push may not"
category = "structure"
covers = ["restore-version-permission"]
rules = ["C3", "C8", "C12", "C20"]
given = "The family owns two folders at its top level, gf1, which members may change, and gx. Ines, the owner, renames gx on one device and moves it under gf1 on the other; the move arrives last. Later Tom, a member, and Ines both rename gx, and Tom's rename arrives last."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "gf1", entity = "folder", profile = "g-fam", rev = 8, fields = { name = "Family", member_permission = "edit" } },
  { id = "gx", entity = "folder", profile = "g-fam", rev = 9, fields = { name = "Templates", member_permission = "edit" } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "gx"
fields = { name = "Templates 2026" }

[[scenario.step]]
id = "b1"
at = "B"
do = "move"
row = "gx"
to = "gf1"

[[scenario.step]]
at = "A"
do = "online"
answers = { gx = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { gx = "applied+conflict" }
note = "The owner's own conflict: the move replaced the rename unseen. gx is now a sub-folder of gf1. The conflict offers a1, in which gx is at the top level of the group."

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "gx"
fields = { name = "Our templates" }

[[scenario.step]]
id = "a2"
at = "A"
do = "edit"
row = "gx"
fields = { name = "Templates (2026)" }
answers = { gx = "applied" }

[[scenario.step]]
at = "C"
do = "online"
answers = { gx = "applied+conflict" }
note = "Tom may rename a sub-folder of a tree members may change (§4.3). His rename replaces a2 unseen and takes a1 over from the open conflict (C3). Tom has been a member all along, so both versions are on offer to him."

[[scenario.step]]
id = "x1"
at = "C"
do = "resolve"
row = "gx"
choice = "restore"
answer = "error:forbidden"
note = "Tom chooses a1. Restoring it would put gx back at the top level of the group, with the member permission it had there. That is a move to the top, which needs `manage`: a restore is judged as a push of that version by that user would be (C20, §4.3), and a push of it by Tom is `rejected: forbidden`. Nothing is written and the conflict stays open. Restoring a2, which only changes the name, would have been his to do; restoring a1 is Ines's."

[scenario.outcome]
summary = "The folder is where the owner moved it, under gf1, with the name Tom gave it. The conflict is open and offers a2 and a1 to both of them. Tom's attempt to restore the version from the top level was refused and changed nothing."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "gf1", state = "live", version = "start" },
  { row = "gx", state = "live", version = "c1", fields = { parent = "gf1", name = "Our templates" } },
]
history = [
  { row = "gx", version = "start" },
  { row = "gx", version = "a1" },
  { row = "gx", version = "b1" },
  { row = "gx", version = "a2" },
]
conflicts = [
  { row = "gx", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "replaced" },
  { row = "gx", kind = "edit_edit", winner = "c1", loser = "a2", carried = ["a1"], parties = ["tom", "ines"], state = "open" },
]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.C]
same_as = "server"
shown = ["conflict"]

# ---------------------------------------------------------------------------------------------
# An access entry begins when its request has ended (the re-verification of task 4.3's fixes, N1)
# ---------------------------------------------------------------------------------------------

[[scenario]]
id = "S88"
title = "A version replaced in the same push that shares its folder is not handed to a member"
category = "sharing"
covers = ["conflict-version-same-push"]
rules = ["C3", "C20", "C21", "C24", "D2"]
given = "Ines shares f1 with the family, to change; f2 is private and holds the snippet s2. On her first device she writes a door code into s2. Her second device, which was offline, replaces the text of s2 and then moves the whole folder f2 into the shared folder; it sends both changes in one push. Tom edits s2 offline, Ines edits it once more, and Tom's edit arrives last."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 4, fields = { name = "Private" } },
  { id = "s2", entity = "snippet", folder = "f2", rev = 8, fields = { abbreviation = ";door", body = "The door code changes on Friday." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s2"
fields = { body = "The door code is 4711 until Friday, then 2468." }
answers = { s2 = "applied" }

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s2"
fields = { body = "Ask me for the door code." }

[[scenario.step]]
id = "b2"
at = "B"
do = "move"
row = "f2"
to = "f1"

[[scenario.step]]
at = "B"
do = "online"
answers = { s2 = "applied+conflict", f2 = "applied" }
note = "One push with both changes. The server applies folders before snippets (§6.3), so it moves f2 under the shared folder first and replaces the text of s2 second; Ines made them in the other order. b1 replaced a1 unseen: her own conflict, which offers a1. For Tom the folder and the snippet become readable as this request leaves them, with b1's text (C21). His access to f2 begins when the request has ended (§5.4): a1 was replaced inside it, and no state of the server ever showed it to him."

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s2"
fields = { body = "Ask Ines for the door code." }

[[scenario.step]]
id = "a2"
at = "A"
do = "edit"
row = "s2"
fields = { body = "Ask me or Tom for the door code." }
answers = { s2 = "applied" }

[[scenario.step]]
at = "C"
do = "online"
answers = { s2 = "applied+conflict" }
note = "c1 replaces a2 unseen: a new conflict, which takes over a1 from the open one (C3). Tom is offered a2, which was the row while he could read the folder. a1 is not offered to him and he cannot restore it, although the folder was already 'his' when the server replaced it: the replacement and the move were one request (C20). Ines is offered both. A guess of a1's text, sent by a changed client with a1's revision as its base, is answered like any other write (C17)."

[scenario.outcome]
summary = "The folder is in the shared tree and the snippet has Tom's content. One conflict is open on it. Ines's devices offer her a2 and a1 back; Tom's device offers him a2 only. The door code that Ines took out of the snippet before she moved the folder has reached no device of Tom's, whether her device sent the two changes apart or together."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "f2", state = "live", version = "b2", fields = { parent = "f1" } },
  { row = "s2", state = "live", version = "c1" },
  { row = "sh1", state = "live", version = "start" },
]
history = [
  { row = "f2", version = "start" },
  { row = "s2", version = "start" },
  { row = "s2", version = "a1" },
  { row = "s2", version = "b1" },
  { row = "s2", version = "a2" },
]
conflicts = [
  { row = "s2", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "replaced" },
  { row = "s2", kind = "edit_edit", winner = "c1", loser = "a2", carried = ["a1"], parties = ["tom", "ines"], state = "open" },
]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.C]
same_as = "server"
shown = ["conflict"]

[[scenario]]

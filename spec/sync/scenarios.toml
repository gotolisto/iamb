at = "A"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
id = "x1"
at = "A"
do = "sign_out"
note = "Signing out removes the tokens. The user's own library stays on the computer and keeps working, with its outbox, its revisions and the id of the account it belongs to. A is offline, so it cannot ask the server before it signs out: had it held folders of other people, they would be set aside until the next sign-in, not removed (D14)."

[[scenario.step]]

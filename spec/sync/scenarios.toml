[[scenario]]
id = "S77"
title = "After a restore, a member's edit in a folder that is no longer shared with them"
category = "server"
covers = ["restore-lost-edit-kept"]
rules = ["C11", "C18", "D6", "D7"]
given = "After a backup, Ines shares f1 with the family, to change, and her device goes offline. Tom edits s1 in the folder, and the edit is synced. Then the server's database is lost and restored from the backup, which knows nothing of the share. Tom's device comes back first, then Ines's."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
]

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "a1"
at = "A"
do = "create"
entity = "folder_share"
row = "sh1"
folder = "f1"
group = "g-fam"
fields = { permission = "edit" }
answers = { sh1 = "applied" }
note = "After the backup. Tom's device receives the folder."

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s1"
fields = { body = "Open 9 to 6." }
answers = { s1 = "applied" }
note = "Acknowledged by the server, in a revision after the backup. A is offline and does not receive it: Tom's device is the only one that holds this version."

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"
note = "The restored database holds s1 as of the start and no share: for Tom, nothing of Ines's exists there any more."

[[scenario.step]]
at = "C"
do = "pull"
answer = "reset_required:epoch"
note = "Tom's device resyncs. The snapshot holds nothing of Ines's profile and names no line for it, so everything the device holds of that profile counts as lost (D7). s1 is a row Tom could write, in a version he wrote himself: the store leaves it and queues it to be sent again. The resync ends with the access check: f1 is not among the folders Tom may read, so it is purged, and the purge keeps the queued change for the user, because Tom wrote that version (D6, D7). Nothing is sent; the server would have refused it. The share row, which Ines wrote, leaves with the folder and is kept nowhere: it is hers to give back. Had the restore ended the device's session before this pull, the folder would have been set aside and not removed, and the resync after Tom's next sign-in would have taken exactly these steps (D14, S78)."

[[scenario.step]]
at = "A"
do = "online"
answer = "reset_required:epoch"
answers = { sh1 = "applied" }
note = "Ines's device holds the share in a revision above the line of her profile and sends it again. The server does not know the row, so the re-push creates it, and Ines may share the folder (C18, C11). The folder is shared again as she had it, and Tom's device fetches it with s1 as the server holds it. A never held c1, so no device can give that edit back to the server: it stays in Tom's list of changes that were not synced, from which he copies it into the snippet again if he wants it."

[scenario.outcome]
summary = "Tom's edit is not lost and not silently dropped: his device keeps it in the list of changes that were not synced, because the restored server no longer let him write the snippet when his device came back. The share returns when Ines's device gives it back, and Tom has the folder again with the snippet as the backup had it. Ines's device says that the server was restored; Tom's says that the folder went and came back, and that a change of his was kept."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start", fields = { body = "Open 9 to 5." } },
  { row = "sh1", state = "live", version = "a1" },
]
history = []
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = ["restored"]

[scenario.outcome.device.C]
same_as = "server"
shown = ["shared", "revoked", "kept"]
kept = ["c1"]
access = { f1 = "edit" }


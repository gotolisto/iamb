[[scenario]]
id = "S78"
title = "A restore ends the devices' sessions before they have learned of it"
category = "server"
covers = ["restore-ends-sessions"]
rules = ["C18", "C25", "D7", "D14"]
given = "The team owns the folder gf1; Ines, its owner, and Tom may change it. A backup is taken. Tom edits gs1, and the edit is synced to Ines's device. Then the server's database is lost and restored from the backup, which also puts back the sessions and refresh tokens of that moment: the tokens the two devices hold by now are younger than the backup."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-team", kind = "company", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-team", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-team", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "gf1", entity = "folder", profile = "g-team", rev = 3, fields = { name = "Team replies", member_permission = "edit" } },
  { id = "gs1", entity = "snippet", folder = "gf1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
]

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "gs1"
fields = { body = "Open 9 to 6." }
answers = { gs1 = "applied" }
note = "Acknowledged by the server, in a revision after the backup. Ines's device receives it: two devices hold this version, and the server will not."

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"
note = "The restored database holds gs1 as of the start. It also holds the sessions as of the backup: a refresh token is used once and replaced, so the one each device holds now was issued after the backup, and the restored database never issued it."

[[scenario.step]]
at = "C"
do = "pull"
answer = "session_refused"
note = "C's access token has expired. It asks the authentication service for a new one and is refused: for C the session has ended, without a word from Iamb's server. C signs itself out. It cannot know whether the server still holds what it acknowledged, so it removes nothing: the team's folder is set aside, unused and unseen, with gs1 as Tom wrote it (D14). A device that removed the folder here would remove one of the two copies of c1 that exist; when the other device does the same, the edit is nowhere."

[[scenario.step]]
at = "A"
do = "pull"
answer = "session_refused"
note = "The same on Ines's device. It keeps what it holds of the team, set aside, until she signs in again."

[[scenario.step]]
id = "x1"
at = "C"
do = "sign_in"
user = "tom"
answer = "reset_required:epoch"
answers = { gs1 = "applied" }
note = "Tom signs in again. The resync presents the position the device kept, and the server names another epoch: it was restored (C25). What was set aside takes part in the reconcile as what the device holds. gs1 lies above the line of the team's profile, C may write it and Tom wrote that version: C sends it again, and the server, which has not written the row since the restore, applies it without a conflict (C18). When the resync is done nothing is set aside any more."

[scenario.outcome]
summary = "Tom's edit is the snippet again: his device kept the team's folder when the restore ended its session, and gave the edit back at his next sign-in. Ines's device, which nobody has signed in on again, still holds the folder, set aside; it will find the server in step with it when she does. Both devices say that they were signed out."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "gf1", state = "live", version = "start" },
  { row = "gs1", state = "live", version = "c1", fields = { body = "Open 9 to 6." } },
]
history = [{ row = "gs1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = ["signed_out"]

[scenario.outcome.device.C]
same_as = "server"
shown = ["signed_out"]

[[scenario]]
id = "S79"
title = "After a restore, a folder that was shared after a member's removal does not reach that member"
category = "server"
covers = ["restore-share-after-removal"]
rules = ["C16", "C18", "D7"]
given = "Ines owns the family and shares f1 with it; Tom is a member. A backup is taken. On her device A, Ines removes Tom. On her device B she then shares f9 with the family, a folder Tom has never been able to read. Then the server's database is lost and restored from the backup, in which Tom is a member. The function log, kept outside the database, names the removal."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "view" } },
  { id = "f9", entity = "folder", profile = "p-ines", rev = 8, fields = { name = "Family only" } },
  { id = "s9", entity = "snippet", folder = "f9", rev = 9, fields = { abbreviation = ";key", body = "The key is under the blue pot." } },
]

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "x1"
at = "A"
do = "remove_member"
row = "m-tom"
answer = "ok"
note = "A notes the call in its list, with the mark the server answers (D7). The function log records the call, its caller, the group, the person and the mark (§11.1). Tom's device purges f1."

[[scenario.step]]
id = "b1"
at = "B"
do = "create"
entity = "folder_share"
row = "sh9"
folder = "f9"
group = "g-fam"
fields = { permission = "view" }
answers = { sh9 = "applied" }
note = "On Ines's other device, after the removal: the family is Ines alone, and B shows it so."

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"
note = "In the restored database Tom is a member and f9 is not shared."

[[scenario.step]]
id = "o1"
at = "server"
do = "replay_calls"
cascade = ["m-tom"]
note = "This is a step of the restore procedure, before the server is opened: each call is made as its caller and under the call's own rules (C18). Tom is removed again before any device is let in. The script makes no call that gives access."

[[scenario.step]]
at = "B"
do = "pull"
answer = "reset_required:epoch"
answers = { sh9 = "applied" }
note = "B comes back first. It holds the share in a revision above the line of Ines's profile and gives it back; the server creates it (C18). B has no entry for the removal in its own list, because the call was made on A, and no rule on B could have held the share back. It does not matter: Tom is not a member. Without the operator's step the folder would be on Tom's device now, until A had synced."

[[scenario.step]]
at = "C"
do = "pull"
answer = "reset_required:epoch"
note = "Tom's device resyncs and finds his membership ended. It holds nothing of the family, as before the restore."

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
note = "A finds the removal in its list with a mark above the group's line and makes the call again; the server finds Tom removed already, answers as it did the first time and writes nothing (§5.14). The list is the net for a log that was lost (S58, S80)."

[scenario.outcome]
summary = "The folder Ines shared after she had removed Tom is shared with the family again and never reaches him: he was removed again, from the function log, before the restored server let any device in. Ines's devices say that the server was restored; Tom's device holds nothing of the family and says, as it did when he was removed, that the folder is no longer shared with him."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "deleted", version = "o1" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "start" },
  { row = "f9", state = "live", version = "start" },
  { row = "s9", state = "live", version = "start" },
  { row = "sh9", state = "live", version = "b1" },
]
history = [{ row = "m-tom", version = "start" }]
conflicts = []

[scenario.outcome.device.A]

  { row = "f1", state = "deleted", version = "a1" },
  { row = "s1", state = "deleted", version = "a1" },
  { row = "s2", state = "deleted", version = "a1" },
  { row = "s3", state = "deleted", version = "a1" },
]
history = [{ row = "f1", version = "start" }, { row = "s1", version = "start" }, { row = "s2", version = "start" }, { row = "s3", version = "b1" }]
conflicts = [{ row = "s3", kind = "deleted_with_folder", winner = "a1", loser = "b1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]


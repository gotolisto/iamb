kept = ["c1", "c2"]

[[scenario]]
id = "S36"
title = "A folder is shared with two groups and one share ends"
category = "sharing"
covers = ["two-shares-same-folder"]
rules = ["C11", "C12", "C21", "D5"]
given = "Ines shares f1 with the family, to change, and with the team, to use. Tom is in both groups. Tom's device goes offline and he edits s1. Ines stops sharing with the family."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
  { id = "g-team", kind = "company", owner = "ines" },
]
rows = [
  { id = "mf-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "mf-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "mt-ines", entity = "membership", group = "g-team", user = "ines", rev = 10, fields = { role = "owner" } },
  { id = "mt-tom", entity = "membership", group = "g-team", user = "tom", rev = 11, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
  { id = "sh2", entity = "folder_share", folder = "f1", group = "g-team", rev = 12, fields = { permission = "view" } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s1"
fields = { body = "Open 9 to 6." }

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "sh1"
answers = { sh1 = "applied" }
note = "Tom still reaches the folder through the team's share, so his access entry stays, with the permission of that share, and no folder_revoked is written. A folder is revoked only when the last grant ends."


[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },

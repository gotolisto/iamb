devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }, { id = "E", user = "jun" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "p-jun", kind = "personal", owner = "jun" },
  { id = "g-team", kind = "company", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-team", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-team", user = "tom", rev = 6, fields = { role = "admin" } },
  { id = "m-jun", entity = "membership", group = "g-team", user = "jun", rev = 9, fields = { role = "member" } },
  { id = "gf1", entity = "folder", profile = "g-team", rev = 3, fields = { name = "Team replies", member_permission = "view" } },
  { id = "gs1", entity = "snippet", folder = "gf1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
]

[[scenario.step]]
id = "x1"
at = "A"
do = "transfer_ownership"
group = "g-team"
user = "tom"
answer = "ok"
note = "The call records an offer on the group and changes nobody's role: owning a group is not something that can be done to a person. Ines stays the owner until Tom answers."

[[scenario.step]]
id = "x2"
at = "C"
do = "accept_ownership"
group = "g-team"
cascade = ["m-ines", "m-tom"]
answer = "ok"
note = "One transaction: the profile's owner becomes Tom, Tom's membership becomes owner and Ines's becomes admin. A group has exactly one owner at every moment."

[[scenario.step]]
id = "x3"
at = "C"
do = "leave"
row = "m-tom"
answer = "error:owner_cannot_leave"

[[scenario.step]]
id = "x4"
at = "A"
do = "delete_group"
group = "g-team"
answer = "error:not_owner"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "gs1"
fields = { body = "Open 9 to 6." }
answers = { gs1 = "applied" }
note = "As admin Ines may still change the team's snippets."

[scenario.outcome]
summary = "Once Tom has accepted, he is the owner and Ines an admin on every member's device. The two refused calls change nothing and each device says why. Ines's edit is accepted because admins may change the team's content."


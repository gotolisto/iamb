[[scenario]]
id = "S57"
title = "Three people edit one snippet offline"
category = "edit"
covers = ["three-writers"]
rules = ["C3", "D2"]
given = "Ines shares f1 with the family, to change. Tom, Ines and Jun each change the snippet s1 while offline, and come back in that order."

[scenario.start]
users = ["ines", "tom", "jun"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }, { id = "E", user = "jun" }]
profiles = [

# Sync conflict scenarios (task 4.1).
#
# Each scenario gives a starting state, ordered steps and the defined outcome: the final state of
# every row on the server and on every device, the history and conflict records, and what the
# user is shown. `docs/sync-design.md` section 12 writes the same scenarios out in words
# (`python3 spec/sync/render_scenarios.py` renders that section from this file); the rules a
# scenario cites (`C3`, `D2`) are the rules of sections 8 and 9 of that document.
#
# The format and the way a replay reads it are documented in
# `crates/iamb-testkit/src/sync_scenarios.rs`, which also checks this file
# (`cargo test -p iamb-testkit --test sync_scenarios`): at least 30 scenarios, unique ids, an
# outcome for the server and every device that states every row, and an outcome that agrees with
# the scenario's own steps and answers (the server's row is the last write that reached it, the
# history holds what was replaced, a write that replaced an unseen version has its conflict, a
# refused change is kept, devices that end online agree with the server). Whether the rules give
# those answers is checked when the two-device simulation of task 4.4 replays the file.
#
# In short: devices start online and in step with the server; an online device syncs after
# every step that concerns it; `offline` and `online` bracket work done without the server;
# a version is named after the step that wrote it and `start` is what a row holds at the start;
# `cascade` lists the other rows the server writes when a step's change arrives; `absent` means
# no row with that id is there (never received, purged, or not visible).

version = 2

# ---------------------------------------------------------------------------------------------
# Edits of one row
# ---------------------------------------------------------------------------------------------

[[scenario]]
id = "S01"
title = "Two devices change the same field of one snippet"
category = "edit"
covers = ["edit-same-field"]
rules = ["C1", "C2", "C3", "D2", "D4"]
given = "Ines has two devices, both in step. The snippet s1 is in her personal folder f1."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", label = "Thanks", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { s1 = "applied+conflict" }
note = "B pulls first. The remote a1 is not written over B's unsent change (D2). B's push is based on the revision before a1, so it is stale, and it still wins (C2, C3)."

[scenario.outcome]
summary = "The change that reached the server last, b1, is the snippet on the server and on both devices. a1 is kept in the history, and a conflict on both devices offers it back."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "b1" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S02"
title = "Two devices change different fields of one snippet"
category = "edit"
covers = ["edit-different-fields"]
rules = ["C2", "C3", "D2"]
given = "As S01. Device A changes the label, device B the content."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", label = "Thanks", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { label = "Thanks for the order" }

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { s1 = "applied+conflict" }
note = "A push carries the whole row. B's row still has the old label, so the label change of a1 is replaced with the rest (C2: no merging of fields)."

[scenario.outcome]
summary = "The row is B's: the new content with the old label. A's label change is in the history and a conflict offers A's version back. Nothing is merged field by field."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "b1", fields = { label = "Thanks", body = "Thanks a lot for your order." } },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S03"
title = "An edit and a delete of one snippet, the delete arrives last"
category = "delete"
covers = ["edit-vs-delete-delete-last"]
rules = ["C2", "C3", "C5", "D2"]
given = "As S01. Device A edits the snippet while device B deletes it."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
id = "b1"
at = "B"
do = "delete"
row = "s1"

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { s1 = "applied+conflict" }
note = "The delete was made without knowing a1. A delete is a write like any other: it arrives last, so it wins (C5)."

[scenario.outcome]
summary = "The snippet is deleted everywhere. The edited version a1 is in the history, and a conflict on both devices offers to bring it back; the tombstone stays for 30 days."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "deleted", version = "b1" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }]
conflicts = [{ row = "s1", kind = "delete_over_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S04"
title = "An edit and a delete of one snippet, the edit arrives last"
category = "delete"
covers = ["edit-vs-delete-edit-last"]
rules = ["C2", "C3", "C5", "D2"]
given = "As S03, but the deleting device reaches the server first."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
id = "b1"
at = "B"
do = "delete"
row = "s1"

[[scenario.step]]
at = "B"
do = "online"
answers = { s1 = "applied" }

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied+conflict" }
note = "A pulls the tombstone but does not apply it over its unsent edit (D2). The edit arrives last and brings the snippet back (C5)."

[scenario.outcome]
summary = "The snippet is live everywhere with A's content. The conflict tells the user that it had been deleted on the other device, and offers to delete it after all."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a1" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "b1" }]
conflicts = [{ row = "s1", kind = "edit_over_delete", winner = "a1", loser = "b1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S05"
title = "Both devices delete the same snippet"
category = "delete"
covers = ["delete-vs-delete"]
rules = ["C4", "C5", "D4"]
given = "As S01. Both devices delete the snippet while offline."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "s1"

[[scenario.step]]
id = "b1"
at = "B"
do = "delete"
row = "s1"

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { s1 = "unchanged" }
note = "The row is already deleted: the second delete changes nothing, makes no revision and no conflict (C4). B takes the revision of a1."

[scenario.outcome]
summary = "The snippet is deleted once, by a1. No conflict is recorded and nothing is shown."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "deleted", version = "a1" },
]
history = [{ row = "s1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = []

[[scenario]]
id = "S06"
title = "One device moves a snippet, the other edits it"
category = "edit"
covers = ["move-vs-edit"]
rules = ["C2", "C3", "D2"]
given = "Ines has two folders. Device A moves s1 from f1 to f2 while device B changes its content."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 4, fields = { name = "Orders" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "move"
row = "s1"
to = "f2"

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { s1 = "applied+conflict" }
note = "The folder is a field of the snippet's row. B's row still names f1, so the move is replaced with the rest."

[scenario.outcome]
summary = "The snippet has B's content and is back in f1. The moved version is in the history; the conflict offers it back, and the user can also simply move the snippet again."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "f2", state = "live", version = "start" },
  { row = "s1", state = "live", version = "b1", fields = { folder = "f1" } },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S07"
title = "The user restores the other version from a conflict"
category = "edit"
covers = ["resolve-conflict"]
rules = ["C2", "C3", "C20"]
given = "As S01, and then Ines chooses the other version on device A."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { s1 = "applied+conflict" }

[[scenario.step]]
id = "r1"
at = "A"
do = "resolve"
row = "s1"
choice = "restore"
answer = "ok"
note = "The server writes the content of a1 as a new revision by Ines and closes the conflict. It is an ordinary write: it reaches every device through the feed."

[scenario.outcome]
summary = "The snippet has the content of a1 again, as a new revision r1. b1 joined the history. The conflict is resolved and no longer listed."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "r1", fields = { body = "Thank you for your order." } },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }, { row = "s1", version = "b1" }]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "resolved" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S08"
title = "One device reorders a folder, the other renames it"
category = "structure"
covers = ["reorder-vs-rename"]
rules = ["C2", "C3"]
given = "Ines has two top-level folders. Device A drags f2 above f1 (its position changes), device B renames f2."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies", position = 0 } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 4, fields = { name = "Orders", position = 1 } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "f2"
fields = { position = -1 }

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "f2"
fields = { name = "Order replies" }

[[scenario.step]]
at = "A"
do = "online"
answers = { f2 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { f2 = "applied" }
note = "The push is stale, but the only thing changed since its base is the position, which is arrangement and not a recorded field: no conflict is recorded (C3)."

[scenario.outcome]
summary = "The folder has the new name and its old position: the rename wins the whole row and the reordering of this folder is undone, without a conflict. Both versions are in the history."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "f2", state = "live", version = "b1", fields = { name = "Order replies", position = 1 } },
]
history = [{ row = "f2", version = "start" }, { row = "f2", version = "a1" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = []


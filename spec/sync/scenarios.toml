[[scenario]]
id = "S09"
title = "Two devices create a snippet with the same abbreviation"
category = "abbreviation"
covers = ["same-abbreviation-personal"]
rules = ["C9", "D13"]
given = "Ines has two devices, both in step, and no snippet with the abbreviation ;sig. Each device creates one while offline; A does it first."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "create"
entity = "snippet"
row = "s2"
folder = "f1"
fields = { abbreviation = ";sig", body = "Kind regards, Ines" }

[[scenario.step]]
id = "b1"
at = "B"
do = "create"
entity = "snippet"
row = "s3"
folder = "f1"
fields = { abbreviation = ";SIG", body = "Best, Ines Marchetti" }

[[scenario.step]]
at = "A"
do = "online"
answers = { s2 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { s3 = "applied" }
note = "They are two rows, so nothing is replaced and no conflict is recorded. The server does not compare abbreviations (C9)."

[scenario.outcome]
summary = "Both snippets exist everywhere. On both devices the one the server accepted first, s2, holds the abbreviation; s3 neither expands nor resolves and library health lists it under \"abbreviation taken\" until the user renames or deletes one."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s2", state = "live", version = "a1" },
  { row = "s3", state = "live", version = "b1" },
]
history = []
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = ["duplicate"]
expands = { ";sig" = "s2" }

[scenario.outcome.device.B]
same_as = "server"
shown = ["duplicate"]
expands = { ";sig" = "s2" }

[[scenario]]
id = "S10"
title = "A personal snippet and a shared snippet have the same abbreviation"
category = "abbreviation"
covers = ["same-abbreviation-personal-vs-shared"]
rules = ["C9", "C21", "D6", "D13"]
given = "Ines and Tom are in the family group. Tom's folder tf1 holds ;hrs and is not shared yet. Ines, offline, creates her own ;hrs while Tom shares tf1 with the group."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "tf1", entity = "folder", profile = "p-tom", rev = 7, fields = { name = "Shop" } },
  { id = "ts1", entity = "snippet", folder = "tf1", rev = 8, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "create"
entity = "snippet"
row = "s2"
folder = "f1"
fields = { abbreviation = ";hrs", body = "My hours: Tuesday to Friday." }

[[scenario.step]]
id = "c1"
at = "C"
do = "create"
entity = "folder_share"
row = "sh1"
folder = "tf1"
group = "g-fam"
fields = { permission = "view" }
answers = { sh1 = "applied" }

[[scenario.step]]
at = "A"
do = "online"
answers = { s2 = "applied" }
note = "A's feed holds folder_visible(tf1): A fetches the folder whole (D6). Its own s2 is pushed as an ordinary new row."

[scenario.outcome]
summary = "On Ines's device her own snippet holds ;hrs and the shared one is listed in library health (\"Your own ;hrs is used instead\"). On Tom's device, which cannot see s2, his snippet expands as before."

[scenario.outcome.server]
rows = [

given = "Ines shares f1 with the family, to change. Tom changes its one-line snippet s1 so that it reads the clipboard and presses Enter; on Ines's devices that content is held for review. Tom changes it again. Before Ines's device A has received the second change, she changes the label there."

[scenario.start]

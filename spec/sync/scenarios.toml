fields = { body = "Open 9 to 6." }

[[scenario.step]]
id = "c2"
at = "C"
do = "create"
entity = "snippet"
row = "s5"
folder = "f1"
fields = { abbreviation = ";sat", body = "Closed on Saturdays." }

[[scenario.step]]
id = "x1"
at = "A"
do = "remove_member"
row = "m-tom"
answer = "ok"

[[scenario.step]]
at = "C"
do = "online"
note = "C pulls before it pushes. The feed holds folder_revoked(f1): before the folder is purged, the two unsent changes are copied into the list of changes that were not synced and taken out of the outbox (D6). Nothing is left to push; had they been pushed, the server would have refused them (C12)."

[scenario.outcome]
summary = "The server and Ines's device never see Tom's two changes. Tom's device no longer holds the folder; it says that the folder is no longer shared with him and that two changes he made there were not synced and are kept on this computer, where he can copy them into his own snippets. Tom keeps the tombstone of his own membership and sees nothing else of the group; on Ines's device his membership is simply gone, because nobody reads another person's tombstone."


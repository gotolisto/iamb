[[scenario]]
id = "S40"
title = "A member adds key presses to a shared snippet, and the owner's own edit does not hide that"
category = "sharing"
covers = ["review-hold"]
rules = ["C17", "D10"]
given = "Ines shares f1 with the family, to change. Its snippet s1 is one line that Ines wrote. Tom changes it so that it reads the clipboard and presses Enter. Later Ines changes only the label, on her second device."

[scenario.start]
users = ["ines", "tom", "jun"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }, { id = "E", user = "jun" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "p-jun", kind = "personal", owner = "jun" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "m-jun", entity = "membership", group = "g-fam", user = "jun", rev = 9, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";wtrack", label = "Tracking link", body = "Your tracking link: " } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
]

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s1"
fields = { body = "Your tracking link: {clipboard}{key name=\"enter\"}" }
answers = { s1 = "applied" }
note = "The server records Tom as the author of the row and of its content (C17). On Ines's and Jun's devices the new content reads the clipboard and presses a key and was written by someone else, so it is held: they keep typing the last content they were allowed to type, the one line of the start."

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { label = "Paste tracking link" }
answers = { s1 = "applied" }
note = "Ines's push carries Tom's content with her new label. The row's author is now Ines, but the fields that decide what a snippet does did not change in this write, so the server leaves Tom as the author of the content."

[scenario.outcome]
summary = "The row has Ines's label and Tom's content, whose author is still Tom. It stays held for review on Ines's two devices and on Jun's, where typing ;wtrack keeps typing the old line until each of them approves; it is not held on Tom's device. A label edit by the owner cannot make someone else's key presses count as her own."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },

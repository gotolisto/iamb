[[scenario]]
id = "S48"
title = "A second computer with its own snippets signs in for the first time"
category = "server"
covers = ["first-sign-in"]
rules = ["C9", "D9", "D13"]
given = "Ines uses device A with an account: the folder f1 \"Snippets\" holds s1 (;em) and s2 (;sig). Device B was used without an account: its local profile holds a folder lf1, also called \"Snippets\", with ls1 (;em, another address) and ls2 (;addr). Ines signs in on B."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines", signed_in = false }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "lp-b", kind = "personal", owner = "ines", local_to = "B" },
]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Snippets" }, only_on = ["A"] },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";em", body = "ines@brindlewood.example" }, only_on = ["A"] },
  { id = "s2", entity = "snippet", folder = "f1", rev = 6, fields = { abbreviation = ";sig", body = "Kind regards, Ines" }, only_on = ["A"] },
  { id = "lf1", entity = "folder", profile = "lp-b", rev = 0, fields = { name = "Snippets" }, only_on = ["B"] },
  { id = "ls1", entity = "snippet", folder = "lf1", rev = 0, fields = { abbreviation = ";em", body = "ines.marchetti@mail.example" }, only_on = ["B"] },
  { id = "ls2", entity = "snippet", folder = "lf1", rev = 0, fields = { abbreviation = ";addr", body = "12 Millrace Lane" }, only_on = ["B"] },
]

[[scenario.step]]
id = "b1"
at = "B"
do = "sign_in"
user = "ines"
answers = { ls1 = "applied", ls2 = "applied" }
note = "B's library is adopted (D9): its rows move to the account's personal profile and every one of them is queued in the same transaction; B fetches the account's library; a local folder with the name and place of an account folder is merged into it, so ls1 and ls2 move into f1 and lf1 is dropped with its queue entry, without ever being sent; a local snippet identical to one in the account would be dropped too. Nothing is pushed before the merge is done; then what is left is pushed as new rows."

[scenario.outcome]
summary = "Both computers hold one folder \"Snippets\" with all four snippets. The two ;em snippets differ, so both are kept: s1, which the server accepted first, holds the abbreviation and library health lists ls1 on both computers. Nothing that was on either computer is lost."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "s2", state = "live", version = "start" },
  { row = "lf1", state = "absent" },
  { row = "ls1", state = "live", version = "b1", fields = { folder = "f1" } },
  { row = "ls2", state = "live", version = "b1", fields = { folder = "f1" } },
]
history = []
conflicts = []


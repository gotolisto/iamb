[[scenario]]
id = "S12"
title = "One device renames a folder, the other moves it"
category = "structure"
covers = ["folder-rename-vs-move"]
rules = ["C2", "C3", "D2"]
given = "Ines has folders f1 and f2 at the top and f3 inside f1. Device A renames f3 while device B moves it into f2."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 4, fields = { name = "Orders" } },
  { id = "f3", entity = "folder", profile = "p-ines", parent = "f1", rev = 5, fields = { name = "Returns" } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "f3"
fields = { name = "Returns and refunds" }

[[scenario.step]]
id = "b1"
at = "B"
do = "move"
row = "f3"
to = "f2"

[[scenario.step]]
at = "A"
do = "online"
answers = { f3 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { f3 = "applied+conflict" }
note = "Name and parent are fields of the same row. The name was changed since B's base, so the conflict is recorded."

[scenario.outcome]
summary = "The folder is inside f2 with its old name. The renamed version is in the history and a conflict offers it back; renaming again is as quick."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "f2", state = "live", version = "start" },
  { row = "f3", state = "live", version = "b1", fields = { name = "Returns", parent = "f2" } },
]
history = [{ row = "f3", version = "start" }, { row = "f3", version = "a1" }]
conflicts = [{ row = "f3", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S13"
title = "Two devices move two folders into each other"
category = "structure"
covers = ["folder-cycle"]
rules = ["C8", "D3", "D4"]
given = "Ines has top-level folders fa and fb. Device A moves fa into fb while device B moves fb into fa."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "fa", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "fb", entity = "folder", profile = "p-ines", rev = 4, fields = { name = "Orders" } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "move"
row = "fa"
to = "fb"

[[scenario.step]]
id = "b1"
at = "B"
do = "move"
row = "fb"
to = "fa"

[[scenario.step]]
at = "A"
do = "online"
answers = { fa = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { fb = "unchanged+adjusted" }
note = "B's push of fb is not stale (nobody changed fb), but it would close a cycle. The server keeps fb's parent as it is and applies the rest of the row, which changes nothing (C8). B takes the server's row. Between its pull and this answer B's store holds the cycle; the view shows such folders at the top level. The server itself never holds a cycle, also when the two requests arrive together (C24, S53)."

[scenario.outcome]
summary = "fa is inside fb, and fb stays at the top level. B's move is not made, and B says so (\"Orders could not be moved into Replies, which was moved into it on another device\")."

[scenario.outcome.server]
rows = [
  { row = "fa", state = "live", version = "a1", fields = { parent = "fb" } },
  { row = "fb", state = "live", version = "start" },
]
history = [{ row = "fa", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = ["adjusted"]

[[scenario]]
id = "S14"
title = "A new sub-folder would be a fifth level after a move elsewhere"
category = "structure"
covers = ["folder-depth"]
rules = ["C8", "D4"]
given = "Ines has f1 > f2 > f3 (three levels) and a top-level folder g1. Device A moves f1 into g1, which makes f3 the fourth level. Device B, offline, creates f4 inside f3."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "g1", entity = "folder", profile = "p-ines", rev = 2, fields = { name = "Shop" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "f2", entity = "folder", profile = "p-ines", parent = "f1", rev = 4, fields = { name = "Orders" } },
  { id = "f3", entity = "folder", profile = "p-ines", parent = "f2", rev = 5, fields = { name = "Returns" } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "b1"
at = "B"
do = "create"
entity = "folder"
row = "f4"
profile = "p-ines"
parent = "f3"
fields = { name = "Refused" }

[[scenario.step]]
id = "a1"
at = "A"
do = "move"
row = "f1"
to = "g1"
answers = { f1 = "applied" }

[[scenario.step]]
at = "B"
do = "online"
answers = { f4 = "applied+adjusted" }
note = "Inside f3 the new folder would be a fifth level. The server puts it under the nearest ancestor that keeps four levels, f2 (C8), and B takes that row."

[scenario.outcome]
summary = "The new folder exists, beside f3 instead of inside it, and B says that it was placed one level up. Nothing is lost and no tree is deeper than four levels."

[scenario.outcome.server]
rows = [
  { row = "g1", state = "live", version = "start" },
  { row = "f1", state = "live", version = "a1", fields = { parent = "g1" } },
  { row = "f2", state = "live", version = "start" },
  { row = "f3", state = "live", version = "start" },
  { row = "f4", state = "live", version = "b1", fields = { parent = "f2" } },
]
history = [{ row = "f1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = ["adjusted"]

[[scenario]]
id = "S15"
title = "A folder is deleted, then a snippet created in it arrives"
category = "structure"
covers = ["folder-delete-vs-create"]
rules = ["C6", "C7", "D3"]
given = "Ines's folder f1 holds s1 and s2. Device A deletes the folder. Device B, offline, creates s3 in it."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Returns" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rret", body = "Return label attached." } },
  { id = "s2", entity = "snippet", folder = "f1", rev = 6, fields = { abbreviation = ";rno", body = "We cannot take it back." } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "b1"
at = "B"
do = "create"
entity = "snippet"
row = "s3"
folder = "f1"
fields = { abbreviation = ";rwhen", body = "Refunds take five days." }
cascade = ["f1"]

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "f1"
cascade = ["s1", "s2"]
answers = { f1 = "applied" }
note = "The push names the rows the delete cascaded to on A (s1, s2) with their base revisions. The server deletes the whole subtree (C6)."

[[scenario.step]]
at = "B"
do = "online"
answers = { s3 = "applied" }
note = "B applies the three tombstones (it has no unsent change to them). Its new snippet arrives in a deleted folder: the server restores the folder, which Ines may do, and records that on the folder (C7). What the delete had removed stays deleted."

[scenario.outcome]
summary = "The folder is back with the new snippet only; s1 and s2 stay deleted and can be restored for 30 days. A conflict on the folder says that it was deleted on one device and used on the other, and offers to delete it after all."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "b1" },
  { row = "s1", state = "deleted", version = "a1" },
  { row = "s2", state = "deleted", version = "a1" },
  { row = "s3", state = "live", version = "b1" },
]
history = [{ row = "f1", version = "start" }, { row = "f1", version = "a1" }, { row = "s1", version = "start" }, { row = "s2", version = "start" }]
conflicts = [{ row = "f1", kind = "folder_restored", winner = "b1", loser = "a1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]


[[scenario]]
id = "S67"
title = "A share ends and begins again inside one page of the feed"
category = "sharing"
covers = ["share-ends-and-begins"]
rules = ["C11", "C21", "D6", "D11"]
given = "Ines shares f1 with the family, to change. Tom's device is offline and he edits s1. Ines stops sharing the folder and, a moment later, shares it again. Tom's device reads both changes in one page."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s1"
fields = { body = "Open 9 to 6." }

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "sh1"
answers = { sh1 = "applied" }

[[scenario.step]]
id = "a2"
at = "A"
do = "create"
entity = "folder_share"
row = "sh1"
folder = "f1"
group = "g-fam"
fields = { permission = "edit" }
answers = { sh1 = "applied" }
note = "Sharing again writes the same row, live, on top of its tombstone (C11). Tom's access begins anew, with a new time."

[[scenario.step]]
at = "C"
do = "online"
note = "One page holds folder_revoked and then folder_visible for the same folder. C handles visibility entries in the order of the feed: it purges the tree, keeping the unsent change for the user, and then fetches the tree again; the position is stored only once both are done (D6, D11). Handled the other way round, the folder would be fetched and then purged, and be missing from the device."

[scenario.outcome]
summary = "Tom's device holds the folder, as the server has it. His edit was made under the access that ended: it is kept in the list of changes that were not synced, where he can make it again. The device says that the folder was unshared and shared."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "a2" },
]
history = [{ row = "sh1", version = "start" }, { row = "sh1", version = "a1" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.C]
same_as = "server"
shown = ["revoked", "kept", "shared"]
kept = ["c1"]
access = { f1 = "edit" }

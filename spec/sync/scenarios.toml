  { row = "s1", state = "live", version = "b1", fields = { content_by = "tom", updated_by = "ines" } },
  { row = "sh1", state = "live", version = "start" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "c1" }]
conflicts = []


  { row = "m-ines", state = "deleted", version = "x1" },
  { row = "m-tom", state = "absent" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "sh1", state = "deleted", version = "x1" },
  { row = "gf1", state = "absent" },
  { row = "gs1", state = "absent" },
]
shown = []

[scenario.outcome.device.C]
rows = [
  { row = "m-ines", state = "absent" },
  { row = "m-tom", state = "deleted", version = "x1" },
  { row = "f1", state = "absent" },
  { row = "s1", state = "absent" },
  { row = "sh1", state = "absent" },
  { row = "gf1", state = "absent" },
  { row = "gs1", state = "absent" },
]

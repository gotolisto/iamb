[[scenario]]
id = "S37"
title = "A stale device shares a folder that was unshared in the meantime"
category = "sharing"
covers = ["share-stale-put", "two-shares-same-folder"]
rules = ["C11", "C21", "D2", "D5", "D6"]
given = "Ines has two devices. Offline, device B shares f1 with the family, to change. Device A shares the same folder with the same group, to use, and later stops sharing it. Then B comes back. A share's id is derived from the folder and the group, so both devices wrote the same row."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "b1"
at = "B"
do = "create"
entity = "folder_share"
row = "sh1"
folder = "f1"
group = "g-fam"
fields = { permission = "edit" }

[[scenario.step]]
id = "a1"
at = "A"
do = "create"
entity = "folder_share"
row = "sh1"
folder = "f1"
group = "g-fam"
fields = { permission = "view" }
answers = { sh1 = "applied" }
note = "Tom's device gets the folder."

[[scenario.step]]
id = "a2"
at = "A"
do = "delete"
row = "sh1"
answers = { sh1 = "applied" }
note = "Tom's device purges the folder."

[[scenario.step]]
at = "B"
do = "online"
answers = { sh1 = "superseded" }
note = "B's share was made without knowing of a1 and a2. For shares a stale write never wins: the server keeps its row, deleted, and B takes it (C11). Sharing again from B, now that B has seen the delete, would not be stale."

[scenario.outcome]
summary = "The folder stays unshared: a change that would open access cannot win by arriving late. B drops its own share and says that sharing was stopped on another device. Tom's device saw the folder appear and disappear and holds nothing of it."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "sh1", state = "deleted", version = "a2" },
]
history = [{ row = "sh1", version = "a1" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = ["superseded"]

[scenario.outcome.device.C]
same_as = "server"
rows = [{ row = "f1", state = "absent" }, { row = "s1", state = "absent" }, { row = "sh1", state = "absent" }]
shown = ["shared", "revoked"]
access = { f1 = "none" }


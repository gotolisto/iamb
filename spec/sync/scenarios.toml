[[scenario]]
id = "S29"
title = "A device was offline when a folder stopped being shared"
category = "sharing"
covers = ["missed-folder-revoked"]
rules = ["C21", "C22", "D6", "D7"]
given = "Ines shares f1 with the family. Tom has two devices: D is online, C is offline. Ines stops sharing. C comes back 31 days later, after the feed entry and the share's tombstone were purged."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }, { id = "D", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "view" } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "sh1"
answers = { sh1 = "applied" }
note = "The server removes Tom's access entries and puts folder_revoked(f1) in his feed. D reads it at once and purges the folder, its snippets, their approvals and cached files."

[[scenario.step]]
at = "server"
do = "advance"
days = 31

[[scenario.step]]
at = "C"
do = "online"
answer = "reset_required:expired"
note = "C's position is older than the feed. C fetches everything it may see and removes what is not in it: the folder, its snippet and the share row (D7). Had the feed entry been lost for any other reason, the access check that every device runs at start and once a day would have removed the folder the same way."

[scenario.outcome]
summary = "Neither of Tom's devices holds the folder any more, whether it heard of the change at once or a month later. Each says once that the folder is no longer shared. Ines keeps the folder; the share's tombstone is purged everywhere after 30 days."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "sh1", state = "absent" },
]
history = []
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.C]
same_as = "server"
rows = [{ row = "f1", state = "absent" }, { row = "s1", state = "absent" }]
shown = ["revoked"]
access = { f1 = "none" }

[scenario.outcome.device.D]
same_as = "C"
shown = ["revoked"]
access = { f1 = "none" }


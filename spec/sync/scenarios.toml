kept = ["c2"]
access = { f1 = "none", f1b = "edit" }

[[scenario]]
id = "S66"
title = "A device is revoked while it holds unsent changes"
category = "server"
covers = ["device-revoked-with-pending"]
rules = ["C25", "D6", "D14"]
given = "Ines's second computer, B, is offline and holds two unsent changes: one to her own snippet s1 and one to ts1 in a folder Tom shares with the family. She revokes B from her first computer."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
  { id = "tf1", entity = "folder", profile = "p-tom", rev = 7, fields = { name = "Shop" } },
  { id = "ts1", entity = "snippet", folder = "tf1", rev = 8, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "tf1", group = "g-fam", rev = 9, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
id = "b2"
at = "B"
do = "edit"
row = "ts1"
fields = { body = "Open 9 to 6." }

[[scenario.step]]
at = "A"
do = "revoke_device"
device = "B"
answer = "ok"
note = "B's device row is marked revoked. From this commit on every function and every policy refuses B's session, also while its access token has not expired, and the session cannot register another device (C25)."

[[scenario.step]]
at = "B"
do = "online"
answer = "device_revoked"
note = "B is refused at its first call and signs itself out (D14). What belongs to other people's profiles is removed; the unsent change to Tom's snippet is kept for the user first (D6). Ines's own library stays and keeps working, with the unsent change to s1 in its outbox: if she signs in on B again, it is pushed (S49)."

[scenario.outcome]
summary = "Nothing from B reaches the server after the revocation. B is a computer without an account again: it keeps Ines's own library, with her unsent edit still waiting, holds nothing of Tom's folder, and keeps her edit of his snippet in the list of changes that were not synced. It says that it was signed out."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "tf1", state = "live", version = "start" },
  { row = "ts1", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "start" },
]
history = []

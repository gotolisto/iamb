[[scenario]]
id = "S68"
title = "After a restore, a lost edit comes back although the snippet was changed since"
category = "server"
covers = ["restore-lost-edit-vs-new-edit"]
rules = ["C3", "C18", "D2", "D7"]
given = "Ines's snippet s1 is in step on her devices A and B. A backup is taken and B goes offline. A edits s1, and the edit is synced. Then the server's database is lost and restored from the backup. B comes back first and edits s1; then A comes back."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 40, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }
answers = { s1 = "applied" }
note = "Acknowledged by the server, in a revision after the backup."

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"
note = "The restored database holds s1 as of the start. For Ines's profile, the last revision it holds is the one the profile's row recorded before the backup (C18)."

[[scenario.step]]
at = "B"
do = "online"
answer = "reset_required:epoch"
note = "B was offline since before the backup. It holds nothing above the line of its profile and finds every row as it holds it."

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }
answers = { s1 = "applied" }
note = "An ordinary write in the new epoch, based on the revision the restored server holds: not stale, no conflict. Neither B nor the server can know that A holds an edit the restore lost."

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
answers = { s1 = "applied+conflict" }
note = "A resyncs. It holds s1 in a revision above the line the snapshot gives for the profile: a write the restore lost. A does not take b1 over it, although b1 has the higher revision; it leaves its row as it is and sends it again as a re-push (D2, D7). On the server the row was written since the restore, so the re-push is an ordinary stale write: it wins, and a conflict offers b1 back (C18, C3). Taking b1 because it is newer would have replaced an acknowledged edit unseen, and left it nowhere."

[scenario.outcome]
summary = "The edit the restore lost is the snippet again, and the edit made after the restore is kept in the history and offered back by a conflict on both devices. Neither is lost, and Ines chooses."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a1", fields = { body = "Thank you for your order." } },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "b1" }]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "a1", loser = "b1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S69"
title = "After a restore, a snippet made right after the backup comes back, whatever the revision counter says"
category = "server"
covers = ["restore-line-per-profile"]
rules = ["C13", "C18", "C24", "D7"]
given = "Ines and Tom each have their own library and share nothing. Tom edits a snippet of his; a backup is taken; then Ines creates the snippet s2, which is synced. Then the server's database is lost and restored from the backup."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 40, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
  { id = "tf1", entity = "folder", profile = "p-tom", rev = 7, fields = { name = "Shop" } },
  { id = "ts1", entity = "snippet", folder = "tf1", rev = 41, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
]

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "ts1"
fields = { body = "Open 9 to 6." }
answers = { ts1 = "applied" }
note = "A write in Tom's profile. Its revision is above every revision of Ines's profile, whose row still records 40 as its last."

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "a1"
at = "A"
do = "create"
entity = "snippet"
row = "s2"
folder = "f1"
fields = { abbreviation = ";rlate", body = "Your order left us late." }
answers = { s2 = "applied" }
note = "Written after the backup, in the next revision after c1's. That revision is above the last one the backup holds of Ines's profile. It is not above the value the revision counter has in the restored database: a sequence is logged up to 32 values ahead, so the restored counter stands past revisions that were given out after the backup's moment."

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
answers = { s2 = "applied" }
note = "The snapshot gives A the line of each profile it reads: for p-ines, the last revision the restored database holds of that profile, which its own row says (C18, C24). s2 lies above it, so it is a write the restore lost: A sends it again, and the re-push creates the row (C13). One line for the whole server, read from the restored counter, would lie above s2's revision; A would take the snippet for one that was deleted and purged, and remove it."

[[scenario.step]]
at = "C"
do = "pull"
answer = "reset_required:epoch"
note = "Tom's device holds nothing above the line of his profile: his edit is in the backup."

[scenario.outcome]
summary = "The snippet Ines made right after the backup is on the server and on her device again, and Tom's edit, which the backup holds, is untouched. What a restore lost is measured per profile, by the revision the profile's own row recorded, and not by the revision counter."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "tf1", state = "live", version = "start" },
  { row = "ts1", state = "live", version = "c1" },
  { row = "s2", state = "live", version = "a1" },
]
history = [{ row = "ts1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
rows = [{ row = "tf1", state = "absent" }, { row = "ts1", state = "absent" }]
shown = []

[scenario.outcome.device.C]
same_as = "server"
rows = [{ row = "f1", state = "absent" }, { row = "s1", state = "absent" }, { row = "s2", state = "absent" }]
shown = []

[[scenario]]
id = "S70"
title = "After a restore, two devices hold different lost versions of one snippet"
category = "server"
covers = ["restore-two-lost-versions"]
rules = ["C3", "C18", "D7"]
given = "After a backup, Ines edits s1 on device B, which then goes offline, and edits it differently on device A, which had been offline and had not seen B's edit: A's edit wins, with a conflict. Then the server's database is lost and restored from the backup, and with it the conflict. B comes back first."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 40, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }
answers = { s1 = "applied" }

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied+conflict" }
note = "A's edit was made without b1: it is stale, it wins, and a conflict offers b1 back (C3). B is offline and still holds b1 as the snippet."

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"
note = "The restore loses both edits, the history of s1 and the conflict."

[[scenario.step]]
at = "B"
do = "online"
answer = "reset_required:epoch"
answers = { s1 = "applied" }
note = "B holds b1, in a revision above the line of the profile, and sends it again. The row has not been written since the restore: the re-push is applied without a conflict (C18)."

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
answers = { s1 = "applied+conflict" }
note = "A holds a1, a later revision of the same lost history, and sends it again whatever the server holds (D7). The row was written since by a re-push of an earlier lost revision: the later one is the row, and the earlier one goes to the history. The two differ, and the server no longer knows whether a1 was written with b1 in view, so a conflict offers b1 back (C18). Had A come back first, B's re-push would have been answered superseded, and b1 would be in the history, under its lost revision, with the same conflict."

[scenario.outcome]
summary = "Both lost versions come back: the later one is the snippet, the earlier one is in the history, and the conflict the restore had lost is there again on both devices. A restore loses nothing that a device still holds."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a1" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "b1" }]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "a1", loser = "b1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S71"
title = "The answer to a pull is lost twice in a row"
category = "transport"
covers = ["lost-pull-answers"]
rules = ["C25", "D11"]
given = "Ines's device A is on a bad connection. Device B edits s1. A pulls three times before an answer reaches it."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", label = "Thanks", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "manual"
note = "So that each of A's calls is a step."

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }
answers = { s1 = "applied" }

[[scenario.step]]
at = "A"
do = "pull"
answer = "lost"
note = "A presents the position it holds, P. The server issues the next position and keeps two for the device: the one it issued last, and P, the one that was presented for it. The answer does not arrive."

[[scenario.step]]
at = "A"
do = "pull"
answer = "lost"
note = "A presents P again: a repeat. The server issues another position; the presented one is still P, and only the last one is replaced (C25). A rule that kept the last two positions issued would now hold neither of them as P."

[[scenario.step]]
at = "A"
do = "pull"
note = "P a third time, and it is accepted like the second: a position presented again is no copy of the device, however often. This answer arrives. A applies b1 and stores the new position with it (D11)."

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { label = "Thanks, short" }

[[scenario.step]]
at = "A"
do = "push"
answers = { s1 = "applied" }
note = "The push presents the position A now holds, the one the server issued last."

[[scenario.step]]
at = "A"
do = "auto"

[scenario.outcome]
summary = "Nothing happens to the device whose answers were lost: it is not taken for a second installation, is not signed out, and syncs on. Both devices hold b1's content with a1's label, and nothing is shown."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a1", fields = { label = "Thanks, short", body = "Thanks a lot for your order." } },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "b1" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = []

[[scenario]]
id = "S72"
title = "The owner moves a sub-folder out of a shared folder"
category = "sharing"
covers = ["subfolder-leaves-share"]
rules = ["C21", "D2", "D3", "D6"]
given = "Ines shares f1 with the family, to change. It has a sub-folder f1b with the snippet s2. Tom's device is offline and he edits s2. Ines moves the sub-folder into her private folder f2."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f1b", entity = "folder", profile = "p-ines", parent = "f1", rev = 4, fields = { name = "Returns" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 8, fields = { name = "Private" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "s2", entity = "snippet", folder = "f1b", rev = 9, fields = { abbreviation = ";rret", body = "Return label attached." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s2"
fields = { body = "Return label attached. Thank you." }

[[scenario.step]]
id = "a1"
at = "A"
do = "move"
row = "f1b"
to = "f2"
answers = { f1b = "applied" }
note = "The move writes one row, f1b. Its snippet is not written. For Tom the tree under f1b stops being readable: his feed gets the row f1b, delivered as null, and folder_revoked for f1b (C21)."

[[scenario.step]]
at = "C"
do = "online"
note = "C applies the page's rows first. The null row is one for a folder, so the store ends that tree as a purge does: the unsent change to s2 goes to the list of kept changes, then f1b and s2 are removed together (D3). Removing the folder row alone would fail, because the store does not let a folder go while it holds a snippet, and the page would be refused each time until the device resynced. folder_revoked finds nothing left (D6). The rest of the shared folder stays as it is."

[scenario.outcome]
summary = "The sub-folder and its snippet are in Ines's private folder, unchanged. They leave Tom's device in one step, with no refused page and no resync; his device says that the folder is no longer shared with him and keeps his unsent edit in the list of changes that were not synced. The shared folder itself stays."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "f1b", state = "live", version = "a1", fields = { parent = "f2" } },
  { row = "f2", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "s2", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "start" },
]
history = [{ row = "f1b", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.C]
same_as = "server"
rows = [{ row = "f1b", state = "absent" }, { row = "f2", state = "absent" }, { row = "s2", state = "absent" }]
shown = ["revoked", "kept"]
kept = ["c1"]
access = { f1 = "edit", f1b = "none" }

[[scenario]]
id = "S73"
title = "A member links a row of their own to a file of the owner's whose hash they know"
category = "attachments"
covers = ["file-by-known-hash"]
rules = ["C12", "C19"]
given = "Ines shares f1 with the family, to change. Her private snippet s3, in f2, uses an image whose stored file Tom cannot read. Tom knows the file's hash. He writes an attachment row with that hash and links it from the shared snippet s1."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 5, fields = { name = "Private" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 7, fields = { abbreviation = ";hrs", kind = "rich", body = "Open 9 to 5." } },
  { id = "s3", entity = "snippet", folder = "f2", rev = 9, fields = { abbreviation = ";iban", kind = "rich", body = "My account: ![card](attachment:sha-card)" } },
  { id = "at2", entity = "attachment", profile = "p-ines", rev = 17, fields = { sha256 = "sha-card", backed = true } },
  { id = "la2", entity = "snippet_attachment", snippet = "s3", attachment = "at2", rev = 19 },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 20, fields = { permission = "edit" } },
]

[[scenario.step]]
id = "c1"
at = "C"
do = "create"
entity = "attachment"
row = "at9"
profile = "p-ines"
fields = { sha256 = "sha-card" }
answers = { at9 = "applied" }
note = "Tom may create an attachment row in the profile, because he may change a folder of it. The row names the hash of a file he does not have. The server marks a new row as backed only when its creator can read the verified file at that moment; Tom cannot, so at9 is not backed (C19). The answer says that the file is missing, exactly as for a file nobody has."

[[scenario.step]]
id = "c2"
at = "C"
do = "create"
entity = "snippet_attachment"
row = "la9"
snippet = "s1"
attachment = "at9"
answers = { la9 = "applied" }
note = "Allowed as well: s1 is in the shared folder and at9 is in the folder's profile (C12). A snippet Tom can read now has a live link to a row with the hash of Ines's file. That gives him nothing: a link counts for a file only when its attachment row is backed. A request for the stored file answers as for a file that does not exist, as it did before, and the call that opens an upload does not say that the file exists. If Tom had the bytes he would upload them; the commit would find the file, mark his row as backed, and the link would count from then on."

[scenario.outcome]
summary = "The row and the link exist and give no file to anyone who could not read it before. Tom's device holds his two rows and nothing of f2: not the snippet, not Ines's attachment row, not the file, and no answer tells him whether Ines has a file with that hash."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "f2", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "s3", state = "live", version = "start" },
  { row = "at2", state = "live", version = "start" },
  { row = "la2", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "start" },
  { row = "at9", state = "live", version = "c1", fields = { backed = false } },
  { row = "la9", state = "live", version = "c2" },
]
history = []
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.C]
same_as = "server"
rows = [
  { row = "f2", state = "absent" },
  { row = "s3", state = "absent" },
  { row = "at2", state = "absent" },
  { row = "la2", state = "absent" },
]
shown = []
access = { f1 = "edit" }

[[scenario]]
id = "S74"
title = "A revoked computer is switched on again forty days later"
category = "server"
covers = ["revoked-device-returns"]
rules = ["C25", "D14"]
given = "Ines's second computer, B, is lost while it is switched off. She revokes it from her first computer and goes on working. Forty days later B is switched on, with the session and the refresh token it had."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
at = "A"
do = "revoke_device"
device = "B"
answer = "ok"
note = "B's device row is marked revoked. B's session stays where it is, in the authentication service: nothing there ends one other session, and its refresh token does not expire (C25)."

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }
answers = { s1 = "applied" }

[[scenario.step]]
at = "server"
do = "advance"
days = 40
note = "The daily job has run forty times. It keeps B's revoked row, because the row's session still exists; a revoked row goes only when its session is gone."

[[scenario.step]]
at = "B"
do = "online"
answer = "device_revoked"
note = "B refreshes its token, which the authentication service allows, and calls hello. The session has a revoked row: refused, as it would have been on the first day. Had the row been removed after 30 days, hello would have found a session without a device and registered B again, and B would have read the whole account. B signs itself out (D14), which ends the session; only then does the daily job remove the row."

[scenario.outcome]
summary = "The revoked computer is refused however late it comes back, and receives nothing that was written since. It signs itself out and says so; what it held of Ines's own library is still on it, as on any computer without an account."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a1" },
]
history = [{ row = "s1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
]
shown = ["signed_out"]

[[scenario]]
id = "S75"
title = "A changed client claims to hold more than the server"
category = "server"
covers = ["client-claims-newer-state"]
rules = ["C18", "D12"]
given = "Ines has two devices in step. Tom, who has an account of his own and shares nothing with her, runs a changed client. It reports a revision far above any the server ever gave out, and a position ahead of its feed."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
  { id = "tf1", entity = "folder", profile = "p-tom", rev = 7, fields = { name = "Shop" } },
  { id = "ts1", entity = "snippet", folder = "tf1", rev = 8, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
]

[[scenario.step]]
at = "C"
do = "pull"
answer = "error:server_behind"
note = "Both numbers are what a device would send after the database was restored without its procedure, and both are numbers a client makes up as it likes. The server does not decide which it is. It answers this device server_behind, writes a line to its log for the operator, and changes nothing: no epoch begins, no feed is emptied, no other device's position is forgotten (C18). An honest device answered like this stops syncing, keeps its library and its outbox, and tries hello again every hour (D12)."

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }
answers = { s1 = "applied" }
note = "Ines's devices sync as before. B receives a1 through its feed, from the position it held: nothing was reset."

[scenario.outcome]
summary = "The only device that stops is the one that made the claim. Ines's devices are not made to read their library again; her edit goes from one to the other as on any other day, and nothing is shown on them."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a1" },
  { row = "tf1", state = "live", version = "start" },
  { row = "ts1", state = "live", version = "start" },
]
history = [{ row = "s1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
rows = [{ row = "tf1", state = "absent" }, { row = "ts1", state = "absent" }]
shown = []

[scenario.outcome.device.B]
same_as = "A"
shown = []

[scenario.outcome.device.C]
rows = [
  { row = "f1", state = "absent" },
  { row = "s1", state = "absent" },
  { row = "tf1", state = "live", version = "start" },
  { row = "ts1", state = "live", version = "start" },
]
shown = []

[[scenario]]
id = "S76"
title = "A member deletes a folder above the root of another share"
category = "sharing"
covers = ["delete-above-nested-share"]
rules = ["C6", "C12", "D5"]
given = "Ines shares f1 with the family, to change. Deep inside it, the folder f1c is shared with her team as well, to use. Tom, a member of the family and not of the team, deletes the sub-folder f1b, which holds f1c."

[scenario.start]
users = ["ines", "tom", "jun"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }, { id = "E", user = "jun" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "p-jun", kind = "personal", owner = "jun" },
  { id = "g-fam", kind = "family", owner = "ines" },
  { id = "g-team", kind = "company", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "m-ines-t", entity = "membership", group = "g-team", user = "ines", rev = 10, fields = { role = "owner" } },
  { id = "m-jun", entity = "membership", group = "g-team", user = "jun", rev = 11, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f1b", entity = "folder", profile = "p-ines", parent = "f1", rev = 4, fields = { name = "Returns" } },
  { id = "f1c", entity = "folder", profile = "p-ines", parent = "f1b", rev = 5, fields = { name = "Labels" } },
  { id = "s2", entity = "snippet", folder = "f1b", rev = 8, fields = { abbreviation = ";rret", body = "Return label attached." } },
  { id = "s3", entity = "snippet", folder = "f1c", rev = 9, fields = { abbreviation = ";lbl", body = "Print the label at home." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
  { id = "sh2", entity = "folder_share", folder = "f1c", group = "g-team", rev = 12, fields = { permission = "view" } },
]

[[scenario.step]]
id = "c1"
at = "C"
do = "delete"
row = "f1b"
answers = { f1b = "rejected:forbidden" }
note = "On C the delete takes f1c, s2 and s3 with it. Tom may change what is in f1, and f1b is a sub-folder like any other. But below it lies f1c, the root of the share with the team, and deleting f1b would delete that share with it. A share is ended only by who may end it: the delete needs manage on f1c, which a member never has, so the whole delete is refused and nothing is deleted (C6, C12). The answer has an entry for every row Tom's device had deleted with the folder; the device puts all four back and lists the delete as a change that was not made (D5)."

[scenario.outcome]
summary = "Nothing is deleted, and the team keeps its folder. On Tom's device the sub-folder and everything in it are back, and the list of changes that were not synced says that his deletion of \"Returns\" was not made. A member who may change a shared folder cannot end a share by deleting a folder above it."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "m-ines-t", state = "live", version = "start" },
  { row = "m-jun", state = "live", version = "start" },

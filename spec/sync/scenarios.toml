answers = { f2 = "applied", f3 = "applied+conflict" }
note = "One push. The server applies a folder before the folders below it (§6.3): f2 moves under the shared folder, then f3 is renamed. b1 replaced a1 unseen: Ines's own conflict, which offers a1. Tom's access to f2 and f3 begins when the request has ended (§5.4)."


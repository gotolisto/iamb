[[scenario]]
id = "S50"
title = "A new snippet reaches the server, the answer is lost, and the snippet is deleted before the next push"
category = "transport"
covers = ["lost-answer-then-delete"]
rules = ["C3", "C5", "C15", "D1", "D2", "D4", "D15"]
given = "Device A creates s2 and pushes it. The server commits the row, but the answer is lost and the sync agent quits before it can repeat the request. Then the user deletes s2."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
]

[[scenario.step]]
at = "A"
do = "manual"

[[scenario.step]]
id = "a1"
at = "A"
do = "create"
entity = "snippet"
row = "s2"
folder = "f1"
fields = { abbreviation = ";rlate", body = "Your order left us late." }

[[scenario.step]]
at = "A"
do = "push"
answer = "lost"
note = "The server commits s2 and writes its feed entries; B receives it. The answer never arrives. On A the outbox entry of a1 is marked as handed out, in the store, when the agent reads it (D1)."

[[scenario.step]]
at = "A"
do = "restart"
note = "The agent quits before it repeats the request. Nothing remembers the request but the outbox."

[[scenario.step]]
id = "a2"
at = "A"
do = "delete"
row = "s2"
note = "The row's revision on A is still 0. Because an entry of the row was handed out, the delete is not dropped with the row: it waits in the outbox with base 0 and names a1 as the change it follows."

[[scenario.step]]
at = "A"
do = "auto"
answers = { s2 = "applied" }
note = "A pulls: the feed holds s2 as the server has it. The row has an unsent change, so it is skipped and the skipped revision is noted (D2, D15). A pushes the delete. For the server it is a stale delete, and the version it replaces was written by the change the op names as its own earlier one: applied, no conflict (C3, C5). The answer's revision is above the one skipped, so nothing is left to fetch."

[scenario.outcome]
summary = "The snippet is deleted on the server and on both devices, by a2. The delete is not lost although device A never learned that its create had arrived, and the two devices of the account agree."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s2", state = "deleted", version = "a2" },
]
history = [{ row = "s2", version = "a1" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = []

[[scenario]]
id = "S51"
title = "One device deletes a folder, the other had moved a snippet out of it"
category = "structure"
covers = ["folder-delete-vs-move-out"]
rules = ["C6", "D2", "D4", "D15"]
given = "Ines's folder f1 holds s1 and s2; g1 is another folder. Device A, offline, deletes f1. Device B moves s1 to g1. Then A comes back."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Returns" } },
  { id = "g1", entity = "folder", profile = "p-ines", rev = 4, fields = { name = "Shop" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rret", body = "Return label attached." } },
  { id = "s2", entity = "snippet", folder = "f1", rev = 6, fields = { abbreviation = ";rno", body = "We cannot take it back." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "f1"
cascade = ["s2"]
note = "On A the delete takes s1 and s2 with it; both are named in the cascade list of the push."

[[scenario.step]]
id = "b1"
at = "B"
do = "move"
row = "s1"
to = "g1"
answers = { s1 = "applied" }

[[scenario.step]]
at = "A"
do = "online"
answers = { f1 = "applied" }
note = "A pulls: s1 in g1 is skipped, because A's own delete of it is unsent (D2), and the skip is noted (D15). The server deletes what is below f1 now, which is s2 only (C6). The answer carries the server's row for every row of the cascade list. A takes s1 as the server has it, live in g1, and drops its own delete of it (D4)."

[scenario.outcome]
summary = "The folder and the snippet still in it are deleted. The snippet that was moved out before the delete arrived is live in its new folder on both devices: a folder's delete takes what is in the folder on the server, not what the deleting device remembered. No conflict is needed, because nothing was replaced."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "deleted", version = "a1" },
  { row = "g1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "b1", fields = { folder = "g1" } },
  { row = "s2", state = "deleted", version = "a1" },
]
history = [{ row = "f1", version = "start" }, { row = "s1", version = "start" }, { row = "s2", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = []

[[scenario]]
id = "S52"
title = "A folder's delete is refused, and what it had deleted with it comes back"
category = "sharing"
covers = ["folder-delete-refused"]
rules = ["C6", "C12", "D5"]
given = "Ines shares f1 with the family, to change. It has a sub-folder f1b with the snippet s2. Tom, offline, deletes the sub-folder. Before his device is back, Ines lowers the share to \"use only\"."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f1b", entity = "folder", profile = "p-ines", parent = "f1", rev = 4, fields = { name = "Returns" } },
  { id = "s2", entity = "snippet", folder = "f1b", rev = 5, fields = { abbreviation = ";rret", body = "Return label attached." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "delete"
row = "f1b"
note = "On C the delete takes s2 with it."

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "sh1"
fields = { permission = "view" }
answers = { sh1 = "applied" }

[[scenario.step]]
at = "C"
do = "online"
answers = { f1b = "rejected:forbidden" }
note = "The permission counts as it is when the delete arrives (C12). The answer carries the server's row for the folder and for every row of the cascade list. C puts f1b and s2 back as the server has them, removes its entries for both, and lists the delete as a change that was not made (D5)."

[scenario.outcome]
summary = "Nothing is deleted. On Tom's device the sub-folder and its snippet are back, the folder is read-only, and the list of changes that were not synced says that his deletion of \"Returns\" was not made."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "f1b", state = "live", version = "start" },
  { row = "s2", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "a1" },
]
history = [{ row = "sh1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.C]
same_as = "server"
shown = ["kept"]
kept = ["c1"]
access = { f1 = "view" }

[[scenario]]
id = "S53"
title = "Two requests arrive at the same moment"
category = "structure"
covers = ["simultaneous-requests"]
rules = ["C6", "C7", "C8", "C24"]
given = "Both of Ines's devices are online and in step. Within the same second device A moves fa into fb and deletes f1, and device B moves fb into fa and creates s3 in f1. Neither has seen the other's changes, and the two pushes reach the server together."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "fa", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "fb", entity = "folder", profile = "p-ines", rev = 4, fields = { name = "Orders" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 5, fields = { name = "Returns" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 6, fields = { abbreviation = ";rret", body = "Return label attached." } },
]

[[scenario.step]]
at = "A"
do = "manual"

[[scenario.step]]
at = "B"
do = "manual"

[[scenario.step]]
id = "a1"
at = "A"
do = "move"
row = "fa"
to = "fb"

[[scenario.step]]
id = "b1"
at = "B"
do = "move"
row = "fb"
to = "fa"

[[scenario.step]]
id = "a2"
at = "A"
do = "delete"
row = "f1"
cascade = ["s1"]

[[scenario.step]]
id = "b2"
at = "B"
do = "create"
entity = "snippet"
row = "s3"
folder = "f1"
fields = { abbreviation = ";rwhen", body = "Refunds take five days." }
cascade = ["f1"]

[[scenario.step]]
at = "A"
do = "push"
answers = { fa = "applied", f1 = "applied" }
note = "Both requests are at the server. Each first locks the row of the profile it writes, before it reads anything it decides on. A's request gets the lock; B's waits for A's commit (C24)."

[[scenario.step]]
at = "B"
do = "push"
answers = { fb = "unchanged+adjusted", s3 = "applied" }
note = "B's request reads what A's committed. Moving fb into fa would close a cycle, so the parent is kept (C8). s3 arrives in a folder that is deleted, so the folder is restored, with a conflict on it (C7), as in S15. Had B's request taken the lock first, A's would have waited, with the outcomes of S13 mirrored and of S16. In neither order can both moves commit, or a live snippet stay under a deleted folder."

[[scenario.step]]
at = "A"
do = "auto"

[[scenario.step]]
at = "B"
do = "auto"

[scenario.outcome]
summary = "The outcome is that of the two requests one after the other, A's first: fa is inside fb and fb stays at the top; f1 is back with the new snippet only, and a conflict on it says that it was deleted on one device and used on the other. The server never holds a folder cycle or a live snippet under a deleted folder."

[scenario.outcome.server]
rows = [
  { row = "fa", state = "live", version = "a1", fields = { parent = "fb" } },
  { row = "fb", state = "live", version = "start" },
  { row = "f1", state = "live", version = "b2" },
  { row = "s1", state = "deleted", version = "a2" },
  { row = "s3", state = "live", version = "b2" },
]
history = [{ row = "fa", version = "start" }, { row = "f1", version = "start" }, { row = "f1", version = "a2" }, { row = "s1", version = "start" }]
conflicts = [{ row = "f1", kind = "folder_restored", winner = "b2", loser = "a2", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["adjusted", "conflict"]

[[scenario]]
id = "S54"
title = "A member creates, in a shared folder, an abbreviation the owner uses privately"
category = "abbreviation"
covers = ["abbreviation-takeover"]
rules = ["C9", "C17", "D13"]
given = "Ines's private folder f2 holds her snippet ;iban. She shares another folder, f1, with the family, to change. Tom's device, whose clock is far behind, creates a snippet ;iban in f1."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 4, fields = { name = "Private" } },
  { id = "s3", entity = "snippet", folder = "f2", rev = 5, fields = { abbreviation = ";iban", body = "Our account number is on the invoice." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "C"
do = "clock"
offset_ms = -34560000000

[[scenario.step]]
id = "c1"
at = "C"
do = "create"
entity = "snippet"
row = "s5"
folder = "f1"
fields = { abbreviation = ";iban", body = "Please pay to the account Tom gave you." }
answers = { s5 = "applied" }
note = "The server does not compare abbreviations (C9). It keeps the creation time Tom's device sent, which lies long before that of s3, and that time decides nothing. The shared folder is part of Ines's own profile, so \"her own profile first\" would not protect her. What does: on her devices a snippet whose content she wrote comes before every snippet whose content someone else wrote, and the server, not Tom's device, says who wrote s5 (C17, D13)."

[scenario.outcome]
summary = "Both snippets exist. On Ines's device her own ;iban keeps expanding and Tom's is listed in library health; one line of text by a member can never take over an abbreviation the owner's own snippets use. On Tom's device, which cannot see s3, his snippet holds the abbreviation."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "f2", state = "live", version = "start" },
  { row = "s3", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "start" },
  { row = "s5", state = "live", version = "c1", fields = { content_by = "tom" } },
]
history = []
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = ["duplicate"]
expands = { ";iban" = "s3" }

[scenario.outcome.device.C]
same_as = "server"
rows = [{ row = "f2", state = "absent" }, { row = "s3", state = "absent" }]
shown = []
expands = { ";iban" = "s5" }

[[scenario]]

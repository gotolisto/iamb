[[scenario]]
id = "S19"
title = "An image is added to a snippet that was deleted elsewhere, the edit arrives last"
category = "attachments"
covers = ["attachment-vs-snippet-delete"]
rules = ["C5", "C10", "C19", "D2"]
given = "Ines has a formatted snippet s1. Device A, offline, adds an image to it: an attachment row, a changed body and a link. Device B deletes the snippet."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";map", kind = "rich", body = "We are behind the bakery." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "create"
entity = "attachment"
row = "at1"
profile = "p-ines"
fields = { sha256 = "sha-map", mime = "image/png" }

[[scenario.step]]
id = "a2"
at = "A"
do = "edit"
row = "s1"
fields = { body = "We are behind the bakery. ![map](attachment:sha-map)" }

[[scenario.step]]
id = "a3"
at = "A"
do = "create"
entity = "snippet_attachment"
row = "la1"
snippet = "s1"
attachment = "at1"

[[scenario.step]]
id = "b1"
at = "B"
do = "delete"
row = "s1"
answers = { s1 = "applied" }

[[scenario.step]]
at = "A"
do = "online"
answers = { at1 = "applied", s1 = "applied+conflict", la1 = "applied" }
note = "The rows go first, in one request; the bytes are uploaded after the attachment row is accepted. The edit arrives after the delete and brings the snippet back (C5)."

[scenario.outcome]
summary = "The snippet is live with the image on both devices; B downloads the bytes and checks them against the hash. The conflict says that the snippet had been deleted on the other device."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a2" },
  { row = "at1", state = "live", version = "a1" },
  { row = "la1", state = "live", version = "a3" },

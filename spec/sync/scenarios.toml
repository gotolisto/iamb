summary = "The row has Ines's label and Tom's content, whose author is still Tom. It stays held for review on Ines's two devices and on Jun's, where typing ;wtrack keeps typing the old line until each of them approves; it is not held on Tom's device. A label edit by the owner cannot make someone else's key presses count as her own."


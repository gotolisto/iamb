[[scenario]]
id = "S22"
title = "A device comes back after 20 days offline"
category = "offline"
covers = ["long-offline-inside-window"]
rules = ["C3", "C5", "C22", "D1", "D2"]
given = "Ines's folder f1 holds s1 and s2. Device B goes offline and edits s1, creates s3 and deletes s2. Meanwhile device A deletes s1 and edits s2. B returns after 20 days, inside the 30 days for which the server keeps tombstones and the feed."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
  { id = "s2", entity = "snippet", folder = "f1", rev = 6, fields = { abbreviation = ";rlate", body = "Your order left us late." } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }

[[scenario.step]]
id = "b2"
at = "B"
do = "create"
entity = "snippet"
row = "s3"
folder = "f1"
fields = { abbreviation = ";rwhen", body = "It ships within five days." }

[[scenario.step]]
id = "b3"
at = "B"
do = "delete"
row = "s2"

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "s1"
answers = { s1 = "applied" }

[[scenario.step]]
id = "a2"
at = "A"
do = "edit"
row = "s2"
fields = { body = "Sorry, your order left us late." }
answers = { s2 = "applied" }

[[scenario.step]]
at = "server"
do = "advance"
days = 20

[[scenario.step]]
at = "B"
do = "online"
answers = { s1 = "applied+conflict", s3 = "applied", s2 = "applied+conflict" }
note = "The feed still reaches back to B's position. B keeps its own versions of s1 and s2 over the remote ones (D2) and pushes; both pushes are stale and both win."

[scenario.outcome]
summary = "s1 is live with B's content (it had been deleted on A), s2 is deleted (it had been edited on A), s3 exists. Two conflicts offer the other versions. Being offline for 20 days changes nothing about the rules."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "b1" },
  { row = "s2", state = "deleted", version = "b3" },
  { row = "s3", state = "live", version = "b2" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }, { row = "s2", version = "start" }, { row = "s2", version = "a2" }]
conflicts = [
  { row = "s1", kind = "edit_over_delete", winner = "b1", loser = "a1", parties = ["ines"], state = "open" },
  { row = "s2", kind = "delete_over_edit", winner = "b3", loser = "a2", parties = ["ines"], state = "open" },
]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

[[scenario]]
id = "S23"
title = "A device comes back after 45 days offline"
category = "offline"
covers = ["long-offline-beyond-window"]
rules = ["C13", "C22", "D5", "D7", "D8"]
given = "Ines has f1 with s1 and s2, and f2 with s4. Device B goes offline and edits s1, creates s3 in f1 and edits s4. On the first day device A deletes s1 and the folder f2. B returns after 45 days: the server purged the deleted rows and their history on day 31, and B's feed position is older than the feed reaches."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
  { id = "s2", entity = "snippet", folder = "f1", rev = 6, fields = { abbreviation = ";rlate", body = "Your order left us late." } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 7, fields = { name = "Returns" } },
  { id = "s4", entity = "snippet", folder = "f2", rev = 8, fields = { abbreviation = ";rret", body = "Return label attached." } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }

[[scenario.step]]
id = "b2"
at = "B"
do = "create"
entity = "snippet"
row = "s3"
folder = "f1"
fields = { abbreviation = ";rwhen", body = "It ships within five days." }

[[scenario.step]]
id = "b3"
at = "B"
do = "edit"
row = "s4"
fields = { body = "A prepaid return label is attached." }

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "s1"
answers = { s1 = "applied" }

[[scenario.step]]
id = "a2"
at = "A"
do = "delete"
row = "f2"
cascade = ["s4"]
answers = { f2 = "applied" }

[[scenario.step]]
at = "server"
do = "advance"
days = 45
note = "On day 31 the server's purge removes s1, f2 and s4 and their history for good."

[[scenario.step]]
at = "B"
do = "online"
answer = "reset_required:expired"
answers = { s1 = "rejected:gone", s3 = "applied", s4 = "rejected:gone" }
note = "B's position is older than the feed, so B resyncs (D7): it fetches everything it may see and removes synced rows the server no longer has, except rows with unsent changes and the folders above them, which it notes as left alone: s1, s4 and f2. Its pushes for s1 and s4 name rows the server does not know (C13). B keeps both changes for the user and removes the rows (D5). Then nothing is unsent under f2 any more, the server's snapshot did not hold it, and the store removes it as well (D7)."

[scenario.outcome]
summary = "The new snippet s3 is everywhere. The rows deleted more than 30 days ago stay gone on the server; B's two changes to them are kept on B, in the list of changes that were not synced, where the user can copy them into new snippets. A's own tombstones were purged on A after 30 days."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "absent" },
  { row = "s2", state = "live", version = "start" },
  { row = "s3", state = "live", version = "b2" },
  { row = "f2", state = "absent" },
  { row = "s4", state = "absent" },
]
history = []
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = ["kept"]
kept = ["b1", "b3"]


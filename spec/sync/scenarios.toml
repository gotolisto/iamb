[[scenario]]
id = "S58"
title = "The server is restored from a backup taken before a member was removed"
category = "server"
covers = ["restore-membership"]
rules = ["C16", "C18", "C21", "D6", "D7"]
given = "Ines shares f1 with the family. A backup is taken. Then Ines removes Tom from the group, and Tom's device purges the folder. Then the server's database is lost and restored from the backup."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "view" } },
]

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "x1"
at = "A"
do = "remove_member"
row = "m-tom"
answer = "ok"
note = "Tom's device purges the folder."

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"
note = "The restored database knows nothing of the removal: Tom is a member again. Account calls made after the backup are lost with it, and no device can push a membership (C16). The server starts a new epoch (C18)."

[[scenario.step]]
at = "C"
do = "pull"
answer = "reset_required:epoch"
note = "Tom's device resyncs. Rows only the server writes are taken as the server has them, so it holds the membership again, and the folder arrives again."

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
note = "Ines's device resyncs and compares row by row (D7). It held the tombstone of m-tom in a revision the server no longer has, and the server shows the membership live: a removal made after the backup. The device takes the server's row, tells Ines that the server was restored and that she should look at her members, and does not wait for her: what took access away is made again."

[[scenario.step]]
id = "x2"
at = "A"
do = "remove_member"
row = "m-tom"
answer = "ok"
note = "The device makes the call by itself, because its user may still make it (D7). A device never repeats a call that gives access. Tom's device purges the folder again."

[scenario.outcome]
summary = "Tom is removed again as soon as a device of someone who may remove him has synced; until then he had the folder back, which is what a restore costs and what the restore procedure tells owners. Ines's device says that the server was restored. Tom's device says that the folder is no longer shared with him."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "deleted", version = "x2" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "start" },
]
history = [{ row = "m-tom", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
rows = [{ row = "m-tom", state = "absent" }]
shown = ["restored"]

[scenario.outcome.device.C]
rows = [
  { row = "m-ines", state = "absent" },
  { row = "m-tom", state = "deleted", version = "x2" },
  { row = "f1", state = "absent" },
  { row = "s1", state = "absent" },
  { row = "sh1", state = "absent" },
]
shown = ["revoked", "shared"]
access = { f1 = "none" }

[[scenario]]
id = "S59"
title = "After a restore, only one device holds what the backup lacks"
category = "server"
covers = ["restore-single-holder"]
rules = ["C13", "C18", "D7"]
given = "Device B is offline. A backup is taken. Device A creates s2 and edits s1, and syncs both. Then the server's database is lost and restored from the backup. B comes back before A does."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "a1"
at = "A"
do = "create"
entity = "snippet"
row = "s2"
folder = "f1"
fields = { abbreviation = ";rlate", body = "Your order left us late." }
answers = { s2 = "applied" }

[[scenario.step]]
id = "a2"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }
answers = { s1 = "applied" }

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"

[[scenario.step]]
at = "B"
do = "online"
answer = "reset_required:epoch"
note = "B was offline since before the backup. It resyncs and finds every row as it holds it: nothing to send."

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
answers = { s1 = "applied", s2 = "applied" }
note = "A compares row by row (D7): the server holds s1 in an older revision and does not hold s2. A sends both again, marked as re-pushes with the revisions it holds. Both revisions lie in the span the restore lost. The server takes s1 without a conflict, because nobody wrote it in the new epoch, and creates s2: a re-push of a lost revision is the one put with a base above 0 that may create a row (C13, C18)."

[scenario.outcome]
summary = "The one device that held the changes made after the backup gives them back: s1 has the content of a2 and s2 exists, on the server and on both devices. Nothing is shown."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a2" },
  { row = "s2", state = "live", version = "a1" },
]
history = [{ row = "s1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = []

[[scenario]]
id = "S60"
title = "A data directory is copied to a second computer and both are used"
category = "server"
covers = ["copied-data-directory"]
rules = ["C3", "C25", "D14"]
given = "Ines moves to a new computer with the system's migration tool: B starts as a copy of A's data directory, with A's device id, feed position and tokens. She keeps using both, and edits s1 on each while offline."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines", copy_of = "A" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied" }
note = "A pulls with the position both installations hold, receives the next one, and pushes."

[[scenario.step]]
at = "B"
do = "online"
answers = { s1 = "applied+conflict" }
note = "B presents the position A used before. The server knows it as the one before its latest and must take the call for a repeat after a lost answer (C25). B's push is stale and replaces a1. a1 was written under the same device id, but not by a change B's op names as its own earlier one, so the conflict is recorded all the same (C3)."

[[scenario.step]]
at = "A"
do = "pull"
answer = "error:device_conflict"
note = "A's position is now neither the server's latest nor the one before it: two installations use one device id. A is told so, makes a new device id and calls hello, which is refused as well: the session came with the copy and already has a device. A signs itself out, keeping its library and its outbox (D14), and asks Ines to sign in again on this computer."

[[scenario.step]]
id = "x1"
at = "A"
do = "sign_in"
user = "ines"
note = "A new session and a new device id. A resyncs and takes b1."

[scenario.outcome]
summary = "The second installation's edit wins by arriving last, and a conflict offers the first one back, although both were written under one device id. The server notices the two installations at the next call of the one that is behind, which signs itself out and comes back as a device of its own. Nothing is replaced silently."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "b1" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict", "signed_out"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]


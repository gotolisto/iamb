[[scenario]]
id = "S58"
title = "The server is restored from a backup taken before a member was removed"
category = "server"
covers = ["restore-membership"]
rules = ["C16", "C18", "C21", "D6", "D7"]
given = "Ines shares f1 with the family. A backup is taken. Then Ines removes Tom from the group on her device A, which notes the call, and Tom's device purges the folder. Then the server's database is lost and restored from the backup. The function log does not reach back to the removal, so the restore script cannot make it again before the server opens (S79 is the case in which it can): what is left is the list on the device."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "view" } },
]

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "x1"
at = "A"
do = "remove_member"
row = "m-tom"
answer = "ok"
note = "The answer carries the mark of the call: the revision it drew under the group's lock (C16). A's agent notes the removal, with the group, the person and that mark, in the device's list of calls that took access away (D7). Nothing else on A records it: Ines's device does not read Tom's membership tombstone, so for A the membership is simply gone. Tom's device purges the folder."

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"
note = "The restored database knows nothing of the removal: Tom is a member again. Account calls made after the backup are lost with it, and no device can push a membership (C16). The server starts a new epoch (C18)."

[[scenario.step]]
at = "C"
do = "pull"
answer = "reset_required:epoch"
note = "Tom's device resyncs. Rows only the server writes are taken as the server has them, so it holds the membership again, and the folder arrives again."

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
note = "Ines's device resyncs. The snapshot gives it, for the group, the last revision the backup holds. The device takes Tom's membership as the server has it, like every row only the server writes. Then it reads its own list: the removal of Tom has a mark above the group's line, so the restore lost that call (D7). The device tells Ines that the server was restored and that she should look at her members, and does not wait for her: what took access away is made again."

[[scenario.step]]
id = "x2"
at = "A"
do = "remove_member"
row = "m-tom"
answer = "ok"
note = "The device makes the call by itself, because its user may still make it, and notes the new mark (D7). It makes it before it gives anything back that the restore lost (S80). A device never repeats a call that gives access. Tom's device purges the folder again."

[scenario.outcome]
summary = "Tom is removed again as soon as the device from which he was removed has synced: it finds the removal in its own list of calls that took access away, with a mark the restored server no longer covers. Until then he had the folder back, which is what a restore costs when the function log does not name the call, and what the restore procedure tells owners. Ines's device says that the server was restored. Tom's device says that the folder is no longer shared with him."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "deleted", version = "x2" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "start" },
]
history = [{ row = "m-tom", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
rows = [{ row = "m-tom", state = "absent" }]
shown = ["restored"]

[scenario.outcome.device.C]
rows = [
  { row = "m-ines", state = "absent" },
  { row = "m-tom", state = "deleted", version = "x2" },
  { row = "f1", state = "absent" },
  { row = "s1", state = "absent" },
  { row = "sh1", state = "absent" },
]
shown = ["revoked", "shared"]
access = { f1 = "none" }

[[scenario]]
id = "S59"
title = "After a restore, only one device holds what the backup lacks"
category = "server"
covers = ["restore-single-holder"]
rules = ["C13", "C18", "D7"]
given = "Device B is offline. A backup is taken. Device A creates s2 and edits s1, and syncs both. Then the server's database is lost and restored from the backup. B comes back before A does."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "a1"
at = "A"
do = "create"
entity = "snippet"
row = "s2"
folder = "f1"
fields = { abbreviation = ";rlate", body = "Your order left us late." }
answers = { s2 = "applied" }

[[scenario.step]]
id = "a2"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }
answers = { s1 = "applied" }

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"

[[scenario.step]]
at = "B"
do = "online"
answer = "reset_required:epoch"
note = "B was offline since before the backup. It resyncs: it holds no row in a revision above the last one the backup holds of its profile, so it has nothing to send, and it finds every row as it holds it."

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
answers = { s1 = "applied", s2 = "applied" }
note = "A goes row by row (D7): it holds s1 and s2 in revisions above the last one the backup holds of its profile. A sends both again, marked as re-pushes with the revisions it holds. Both revisions lie in the span the restore lost. The server takes s1 without a conflict, because nobody wrote it in the new epoch, and creates s2: a re-push of a lost revision is the one put with a base above 0 that may create a row (C13, C18)."

[scenario.outcome]
summary = "The one device that held the changes made after the backup gives them back: s1 has the content of a2 and s2 exists, on the server and on both devices. Nothing is shown."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a2" },
  { row = "s2", state = "live", version = "a1" },
]
history = [{ row = "s1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = []

[[scenario]]
id = "S60"
title = "A data directory is copied to a second computer and both are used"
category = "server"
covers = ["copied-data-directory"]
rules = ["C3", "C25", "D14"]
given = "Ines moves to a new computer with the system's migration tool: B starts as a copy of A's data directory, with A's device id, feed position and tokens. She keeps using both, and edits s1 on each while offline."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines", copy_of = "A" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }

[[scenario.step]]
at = "A"
do = "online"
answers = { s1 = "applied" }
note = "A pulls with the position both installations hold and receives the next one, pushes, and pulls again (§6.7 step 4), which issues another: the server now keeps the last position it issued to A and the one A presented for it (C25)."

[[scenario.step]]
at = "B"
do = "online"
answer = "error:device_conflict"
note = "B presents the position both installations had at the copy. It is neither of the two the server keeps for the device: two installations use one device id (C25). B makes a new device id and calls hello, which is refused as well: the session came with the copy and already has a device. B signs itself out, keeping its library and its outbox with b1 (D14), and asks Ines to sign in again on this computer. Nothing B sent was written. (Corrected in task 4.4: an earlier version had B accepted as a repeat and A caught; with the second pull of §6.7 the installation that is behind is the one caught.)"

[[scenario.step]]
id = "x1"
at = "B"
do = "sign_in"
user = "ines"
answers = { s1 = "applied+conflict" }
note = "A new session and B's new device id: B registers as a device of its own and resyncs, which leaves s1 alone because of its unsent change (D7), then pushes b1, which is stale and replaces a1. a1 was written under the device id B had too, but not by a change B's op names as its own earlier one, so the conflict is recorded all the same (C3)."

[scenario.outcome]
summary = "The second installation's edit wins by arriving last, and a conflict offers the first one back, although both were written under one device id. The server notices the two installations at the first call of the one that is behind, which signs itself out and comes back as a device of its own. Nothing is replaced silently."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "b1" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "b1", loser = "a1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict", "signed_out"]

[[scenario]]
id = "S61"
title = "The owner deletes a shared folder while a member holds an unsent change in it"
category = "sharing"
covers = ["shared-folder-deleted"]
rules = ["C6", "C21", "D2", "D3", "D6"]
given = "Ines shares f1 with the family, to change. Tom's device goes offline and he edits s1. Ines deletes the folder."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s1"
fields = { body = "Open 9 to 6." }

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "f1"
cascade = ["s1", "sh1"]
answers = { f1 = "applied" }
note = "The delete takes the folder's share with it (C6). For Tom the share was the only way to the folder, so its end reaches him as folder_revoked, exactly as when sharing is stopped, and not as tombstones of rows he may no longer read (C21). Ines's own devices get the tombstones."

[[scenario.step]]
at = "C"
do = "online"
note = "C pulls first. Its feed holds the rows the delete wrote, each delivered as null because Tom can no longer read them, and folder_revoked for f1. The null row for s1 is not applied, because s1 has an unsent change (D2). The null row for f1 is a null row for a folder: the store handles it as a purge of that folder (D3), keeps the unsent change for the user and removes the tree in one step, where removing the folder row alone would fail on the snippet it still holds. folder_revoked then finds nothing left (D6). No page is refused, nothing is resynced, and nothing is left to push."

[scenario.outcome]
summary = "The folder, its snippet and its share are deleted; Ines can restore them for 30 days, unshared. Tom's device no longer holds the folder, says that it is no longer shared with him, and keeps his change in the list of changes that were not synced."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "deleted", version = "a1" },
  { row = "s1", state = "deleted", version = "a1" },
  { row = "sh1", state = "deleted", version = "a1" },
]
history = [{ row = "f1", version = "start" }, { row = "s1", version = "start" }, { row = "sh1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.C]
same_as = "server"
rows = [{ row = "f1", state = "absent" }, { row = "s1", state = "absent" }, { row = "sh1", state = "absent" }]
shown = ["revoked", "kept"]
kept = ["c1"]
access = { f1 = "none" }


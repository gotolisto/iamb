[[scenario]]
id = "S46"
title = "The plan does not allow another shared folder"
category = "sharing"
covers = ["plan-limit"]
rules = ["C11", "D5"]
given = "Ines's plan allows one shared folder and f1 is shared with the family already. She shares f2 as well."

[scenario.start]

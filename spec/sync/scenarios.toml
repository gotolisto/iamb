[[scenario]]
id = "S82"
title = "A sub-folder leaves a shared folder and a part of it stays shared by itself"
category = "sharing"
covers = ["nested-share-survives"]
rules = ["C21", "D3", "D6"]
given = "Ines shares f1 with the family, to change. Its sub-folder f1b holds the snippet s2 and the folder f1c, which is shared with the family by itself as well and holds s3. Tom's device is offline; he edits s2 and s3. Ines moves f1b into her private folder f2."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f1b", entity = "folder", profile = "p-ines", parent = "f1", rev = 4, fields = { name = "Returns" } },
  { id = "f1c", entity = "folder", profile = "p-ines", parent = "f1b", rev = 10, fields = { name = "Labels" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 8, fields = { name = "Private" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "s2", entity = "snippet", folder = "f1b", rev = 9, fields = { abbreviation = ";rret", body = "Return label attached." } },
  { id = "s3", entity = "snippet", folder = "f1c", rev = 11, fields = { abbreviation = ";lbl", body = "Print the label at home." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
  { id = "sh2", entity = "folder_share", folder = "f1c", group = "g-fam", rev = 12, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s2"
fields = { body = "Return label attached. Thank you." }

[[scenario.step]]
id = "c2"
at = "C"
do = "edit"
row = "s3"
fields = { body = "Print the label at home, please." }

[[scenario.step]]
id = "a1"
at = "A"
do = "move"
row = "f1b"
to = "f2"
answers = { f1b = "applied" }
note = "The move writes one row, f1b. For Tom the tree under f1b stops being readable, except f1c, which he reads through its own share: his feed gets the row f1b, delivered as null, and folder_revoked for f1b with f1c in except (C21)."

[[scenario.step]]
at = "C"
do = "online"
answers = { s3 = "applied" }
note = "C applies the page's rows first. The null row for f1b ends that tree on the device, except the parts shared by themselves: f1c has a live share with a group Tom is in, so the store leaves it in place with what is in it and with the unsent change to s3 (D3). The unsent change to s2 goes to the list of kept changes, and f1b and s2 are removed. folder_revoked then finds f1b gone and the part it names in place (D6). f1c is an access root of its own from now on and is shown at the top level; the change to s3 is pushed like any other. A null row that took everything below f1b would remove f1c as well, nothing would bring it back before a resync, and the change to s3 would be kept as not synced although Tom may still make it."

[scenario.outcome]
summary = "The sub-folder and its snippet are in Ines's private folder and leave Tom's device, with his unsent edit there kept in the list of changes that were not synced. The folder inside it that is shared by itself stays on his device, at the top level, and his edit there is synced like any other. No device ends without a folder the server shows its user."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "f1b", state = "live", version = "a1", fields = { parent = "f2" } },
  { row = "f1c", state = "live", version = "start" },
  { row = "f2", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "s2", state = "live", version = "start" },
  { row = "s3", state = "live", version = "c2" },
  { row = "sh1", state = "live", version = "start" },
  { row = "sh2", state = "live", version = "start" },
]
history = [{ row = "f1b", version = "start" }, { row = "s3", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.C]
same_as = "server"
rows = [{ row = "f1b", state = "absent" }, { row = "f2", state = "absent" }, { row = "s2", state = "absent" }]
shown = ["revoked", "kept"]
kept = ["c1"]
access = { f1 = "edit", f1b = "none", f1c = "edit" }

[[scenario]]
id = "S83"
title = "A password set with a revoked computer's tokens opens nothing"
category = "server"
covers = ["password-session"]
rules = ["C25", "D14"]
given = "Ines's second computer, B, is lost. She revokes it from her first computer. Whoever holds B takes its tokens from the keychain. Iamb's functions refuse them, but at the authentication service the session still exists: with it they set a password for the account, which never had one, and sign in with that password from an installation of their own, X."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }, { id = "X", user = "ines", signed_in = false }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" }, only_on = ["A", "B"] },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." }, only_on = ["A", "B"] },
]

[[scenario.step]]
at = "B"
do = "offline"

[[scenario.step]]
at = "A"
do = "revoke_device"
device = "B"
answer = "ok"
note = "B's device row is marked revoked: every function and every policy of Iamb refuses B's session from this commit on (C25). The session itself stays a session at the authentication service, which knows nothing of device rows; there its holder can still set a password without knowing an old one."

[[scenario.step]]
id = "x1"
at = "X"
do = "sign_in"
user = "ines"
answer = "session_refused"
note = "Signing in with the password opens a new session, which has no device row and is not revoked. hello refuses it all the same: a token says how its session was opened, and Iamb accepts only sessions opened the ways Iamb signs in, by a link or a code sent to the account's address or by an identity provider (C25). Where the project runs the hook that issues no token for a password, the sign-in fails one step earlier, at the authentication service. Either way X is never registered and reads nothing."

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }
answers = { s1 = "applied" }

[scenario.outcome]
summary = "The installation that signed in with a password holds nothing of the account and receives nothing that is written afterwards; it says that the sign-in was refused. The lost computer holds what it held when it was lost. Ines goes on working, and changes nothing but what she chose to change."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a1" },
]
history = [{ row = "s1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
]
shown = []

[scenario.outcome.device.X]
rows = [
  { row = "f1", state = "absent" },
  { row = "s1", state = "absent" },
]
shown = ["refused"]

[[scenario]]
id = "S84"
title = "After a restore, the owner's device gives back an attachment row a member wrote"
category = "attachments"
covers = ["restore-attachment-row"]
rules = ["C18", "C19", "D7"]
given = "Ines shares f1 with the family, to change. Her private snippet s3 uses an image whose file Tom cannot read; her attachment row at2 is backed. A backup is taken. Then Tom, who knows the file's hash, writes an attachment row at9 with that hash and links it from the shared snippet s1; the row is not backed, and Ines's device receives both rows. Then the server's database is lost and restored from the backup. Ines's device comes back first."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f2", entity = "folder", profile = "p-ines", rev = 5, fields = { name = "Private" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 7, fields = { abbreviation = ";hrs", kind = "rich", body = "Open 9 to 5." } },
  { id = "s3", entity = "snippet", folder = "f2", rev = 9, fields = { abbreviation = ";iban", kind = "rich", body = "My account: ![card](attachment:sha-card)" } },
  { id = "at2", entity = "attachment", profile = "p-ines", rev = 17, fields = { sha256 = "sha-card", backed = true } },
  { id = "la2", entity = "snippet_attachment", snippet = "s3", attachment = "at2", rev = 19 },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 20, fields = { permission = "edit" } },
]

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "c1"
at = "C"
do = "create"
entity = "attachment"
row = "at9"
profile = "p-ines"
fields = { sha256 = "sha-card" }
answers = { at9 = "applied" }
note = "As in S73: Tom cannot read the file, so the row is not backed (C19)."

[[scenario.step]]
id = "c2"
at = "C"
do = "create"
entity = "snippet_attachment"
row = "la9"
snippet = "s1"
attachment = "at9"
answers = { la9 = "applied" }
note = "The link counts for nothing while its row is not backed. Ines's device receives both rows: they are rows of her profile."

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"
note = "The restored database knows neither row."

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
answers = { at9 = "applied", la9 = "applied" }
note = "Both rows lie above the line of Ines's profile and her device may write them, so it gives them back, and the server creates them (C18). Her device holds Tom as the writer of at9, so the op does not say that the row is its sender's own, and the server creates it with nobody as its creator: it is not backed, although the caller of this push can read the file, and no upload makes it so (C19). Created as the caller's row it would be backed, the link would count, and the file would be Tom's to download."

[[scenario.step]]
at = "C"
do = "pull"
answer = "reset_required:epoch"
answers = { at9 = "unchanged", la9 = "unchanged" }
note = "Tom's device holds the same two rows above the line and sends them as well, at9 as its own user's. The server holds both: nothing is written. Tom is the creator of at9 again, and the row is still not backed: he cannot read the file and has not uploaded its bytes."

[scenario.outcome]
summary = "The two rows are back as they were, and the attachment row is as little backed as before the restore: an owner's device that gives back a member's row does not lend it the owner's right to read the file. Tom's device holds his two rows and nothing of the private folder. Ines's device says that the server was restored."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "f2", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "s3", state = "live", version = "start" },
  { row = "at2", state = "live", version = "start" },
  { row = "la2", state = "live", version = "start" },
  { row = "sh1", state = "live", version = "start" },
  { row = "at9", state = "live", version = "c1", fields = { backed = false } },
  { row = "la9", state = "live", version = "c2" },
]
history = []
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = ["restored"]

[scenario.outcome.device.C]
same_as = "server"
rows = [
  { row = "f2", state = "absent" },
  { row = "s3", state = "absent" },
  { row = "at2", state = "absent" },
  { row = "la2", state = "absent" },
]
shown = []
access = { f1 = "edit" }


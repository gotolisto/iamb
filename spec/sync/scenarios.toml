[[scenario]]
id = "S43"
title = "The server is restored from a backup"
category = "server"
covers = ["server-restore"]
rules = ["C13", "C18", "D7"]
given = "Ines's folder f1 holds s1 and s3. After a backup is taken, device A edits s1 and deletes s3 and device B creates s2; all of it is synced. Then the server's database is lost and restored from the backup."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
  { id = "s3", entity = "snippet", folder = "f1", rev = 6, fields = { abbreviation = ";tmp", body = "Scratch." } },
]

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }
answers = { s1 = "applied" }

[[scenario.step]]
id = "k1"
at = "server"
do = "backup"

[[scenario.step]]
id = "a2"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you very much for your order." }
answers = { s1 = "applied" }

[[scenario.step]]
id = "b1"
at = "B"
do = "create"
entity = "snippet"
row = "s2"
folder = "f1"
fields = { abbreviation = ";rlate", body = "Your order left us late." }
answers = { s2 = "applied" }

[[scenario.step]]
id = "a3"
at = "A"
do = "delete"
row = "s3"
answers = { s3 = "applied" }

[[scenario.step]]
at = "server"
do = "restore_backup"
to = "k1"
note = "The restored server holds s1 as of a1, s3 live and no s2. It starts a new epoch: a new epoch id, and revision and feed counters moved past anything it can have issued before."

[[scenario.step]]
at = "A"
do = "pull"
answer = "reset_required:epoch"
answers = { s1 = "applied", s2 = "applied", s3 = "applied" }
note = "A's position belongs to the old epoch. A resyncs and compares row by row (D7): it sends again each row the server holds in an older revision or does not hold at all: s1 as of a2, s2, and the tombstone of s3. The re-push of s2 creates the row, which a re-push of a revision the restore lost may do (C13, C18). The restored rows were not written in the new epoch, so nothing is in conflict."

[[scenario.step]]
at = "B"
do = "pull"
answer = "reset_required:epoch"
answers = { s1 = "unchanged", s2 = "unchanged", s3 = "unchanged" }
note = "B pulls after A's re-push: the rows it would send are already there as it holds them, so its re-pushes change nothing (C4)."

[scenario.outcome]
summary = "The devices give back what the server lost: s1 has the content of a2, s2 exists, and s3 is deleted again. No change made after the backup is lost and no conflict is recorded, because both devices held the same versions."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a2" },
  { row = "s2", state = "live", version = "b1" },
  { row = "s3", state = "deleted", version = "a3" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }, { row = "s3", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = []

[[scenario]]
id = "S44"
title = "A device speaks a protocol version the server no longer accepts"
category = "server"
covers = ["version-mismatch"]
rules = ["C23", "D7", "D12"]
given = "Device A runs a current build (protocol 2), device B an old one (protocol 1). The server stops accepting protocol 1. Then both devices make an edit, and later B is updated."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines", protocol = 2 }, { id = "B", user = "ines", protocol = 1 }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
  { id = "s2", entity = "snippet", folder = "f1", rev = 6, fields = { abbreviation = ";rlate", body = "Your order left us late." } },
]

[[scenario.step]]
id = "k1"
at = "server"
do = "set_protocol"
min = 2
max = 2

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }
answers = { s1 = "applied" }

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s2"
fields = { body = "Sorry, your order left us late." }
answer = "upgrade_required"
note = "Every call of B is answered this way, pulls included. B stops syncing, keeps expanding and editing, keeps its change in the outbox, and says that Iamb must be updated to keep syncing (D12). It does not see a1."

[[scenario.step]]
id = "u1"
at = "B"
do = "upgrade"
protocol = 2
answers = { s2 = "applied" }
note = "A build that speaks a newer protocol resyncs once (D7), then pushes what waited."

[scenario.outcome]
summary = "While B is too old, nothing of B's reaches the server and nothing reaches B, but nothing is lost: after the update B fetches a1 and pushes b1. Both devices end with both edits."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a1" },
  { row = "s2", state = "live", version = "b1" },
]
history = [{ row = "s1", version = "start" }, { row = "s2", version = "start" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = ["upgrade"]


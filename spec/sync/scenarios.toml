[[scenario]]
id = "S65"
title = "A folder and a sub-folder are shared separately and the outer share ends"
category = "sharing"
covers = ["nested-shares"]
rules = ["C21", "D6"]
given = "Ines shares f1 with the family, to change, and its sub-folder f1b too, with a share of its own. Tom, offline, edits s1 in f1 and s2 in f1b. Ines stops sharing f1."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "f1b", entity = "folder", profile = "p-ines", parent = "f1", rev = 4, fields = { name = "Returns" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "s2", entity = "snippet", folder = "f1b", rev = 8, fields = { abbreviation = ";rret", body = "Return label attached." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
  { id = "sh2", entity = "folder_share", folder = "f1b", group = "g-fam", rev = 9, fields = { permission = "edit" } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s2"
fields = { body = "A return label is attached." }

[[scenario.step]]
id = "c2"
at = "C"
do = "edit"
row = "s1"
fields = { body = "Open 9 to 6." }

[[scenario.step]]
id = "a1"
at = "A"
do = "delete"
row = "sh1"
answers = { sh1 = "applied" }
note = "Tom loses f1 and keeps f1b through its own share. His feed gets one entry: folder_revoked for f1, naming f1b as the part that stays (C21)."

[[scenario.step]]
at = "C"
do = "online"
answers = { s2 = "applied" }
note = "C purges f1 except f1b (D6): the unsent change to s1 is kept for the user; the unsent change to s2 lies in the part Tom may still change, stays in the outbox and is pushed. f1b is shown at the top level from now on."

[scenario.outcome]
summary = "Tom's device holds the sub-folder and nothing else of the folder above it. His edit inside the sub-folder is synced like any other; his edit outside it is kept in the list of changes that were not synced. A change he was still allowed to make is not refused because a wider share ended."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "live", version = "start" },
  { row = "m-tom", state = "live", version = "start" },
  { row = "f1", state = "live", version = "start" },
  { row = "f1b", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "s2", state = "live", version = "c1" },
  { row = "sh1", state = "deleted", version = "a1" },
  { row = "sh2", state = "live", version = "start" },
]
history = [{ row = "s2", version = "start" }, { row = "sh1", version = "start" }]

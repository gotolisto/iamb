[[scenario]]
id = "S48"
title = "A second computer with its own snippets signs in for the first time"
category = "server"
covers = ["first-sign-in"]
rules = ["C9", "D9", "D13"]
given = "Ines uses device A with an account: the folder f1 \"Snippets\" holds s1 (;em) and s2 (;sig). Device B was used without an account: its local profile holds a folder lf1, also called \"Snippets\", with ls1 (;em, another address) and ls2 (;addr). Ines signs in on B."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines", signed_in = false }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "lp-b", kind = "personal", owner = "ines", local_to = "B" },
]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Snippets" }, only_on = ["A"] },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";em", body = "ines@brindlewood.example" }, only_on = ["A"] },
  { id = "s2", entity = "snippet", folder = "f1", rev = 6, fields = { abbreviation = ";sig", body = "Kind regards, Ines" }, only_on = ["A"] },
  { id = "lf1", entity = "folder", profile = "lp-b", rev = 0, fields = { name = "Snippets" }, only_on = ["B"] },
  { id = "ls1", entity = "snippet", folder = "lf1", rev = 0, fields = { abbreviation = ";em", body = "ines.marchetti@mail.example" }, only_on = ["B"] },
  { id = "ls2", entity = "snippet", folder = "lf1", rev = 0, fields = { abbreviation = ";addr", body = "12 Millrace Lane" }, only_on = ["B"] },
]

[[scenario.step]]
id = "b1"
at = "B"
do = "sign_in"
user = "ines"
answers = { ls1 = "applied", ls2 = "applied" }
note = "B's library is adopted (D9): its rows move to the account's personal profile; B fetches the account's library; a local folder with the name and place of an account folder is merged into it, so ls1 and ls2 move into f1 and lf1 is dropped without ever being sent; a local snippet identical to one in the account would be dropped too. What is left is pushed as new rows."

[scenario.outcome]
summary = "Both computers hold one folder \"Snippets\" with all four snippets. The two ;em snippets differ, so both are kept: s1, created first, holds the abbreviation and library health lists ls1 on both computers. Nothing that was on either computer is lost."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "s2", state = "live", version = "start" },
  { row = "lf1", state = "absent" },
  { row = "ls1", state = "live", version = "b1", fields = { folder = "f1" } },
  { row = "ls2", state = "live", version = "b1", fields = { folder = "f1" } },
]
history = []
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = ["duplicate"]
expands = { ";em" = "s1" }

[scenario.outcome.device.B]
same_as = "server"
shown = ["duplicate"]
expands = { ";em" = "s1" }

[[scenario]]
id = "S49"
title = "The user signs out with an unsent change and signs in again"
category = "offline"
covers = ["sign-out"]
rules = ["C3", "D2", "D7", "D14"]
given = "Device A is offline and edits s1. Ines signs out on A, and signs in again later with the same account. In between, device B edits the same snippet."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "offline"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
id = "x1"
at = "A"
do = "sign_out"
note = "Signing out removes the tokens and everything that belongs to other people's profiles. The user's own library stays on the computer and keeps working, with its outbox, its revisions and the id of the account it belongs to (D14)."

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thanks a lot for your order." }
answers = { s1 = "applied" }

[[scenario.step]]
at = "A"
do = "online"

[[scenario.step]]
id = "x2"
at = "A"
do = "sign_in"
user = "ines"
answers = { s1 = "applied+conflict" }
note = "The same account as before: nothing is adopted again. As after every sign-in A resyncs, which leaves rows with unsent changes alone, and then pushes the waiting change, which is stale by now and wins."

[scenario.outcome]
summary = "The change made before signing out is not lost: it is pushed at the next sign-in and wins over b1, which a conflict offers back."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "a1" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "b1" }]
conflicts = [{ row = "s1", kind = "edit_edit", winner = "a1", loser = "b1", parties = ["ines"], state = "open" }]

[scenario.outcome.device.A]
same_as = "server"
shown = ["conflict"]

[scenario.outcome.device.B]
same_as = "server"
shown = ["conflict"]

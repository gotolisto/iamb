[[scenario]]
id = "S35"
title = "A group is deleted while a member holds unsent changes"
category = "membership"
covers = ["profile-deletion"]
rules = ["C16", "C21", "D5", "D6"]
given = "Ines owns the family group with Tom as member. She shares her folder f1 with it, to change, and the group owns the folder gf1, which members may change. Tom's device goes offline; he edits s1 and gs1. Ines deletes the group."

[scenario.start]
users = ["ines", "tom"]
devices = [{ id = "A", user = "ines" }, { id = "C", user = "tom" }]
profiles = [
  { id = "p-ines", kind = "personal", owner = "ines" },
  { id = "p-tom", kind = "personal", owner = "tom" },
  { id = "g-fam", kind = "family", owner = "ines" },
]
rows = [
  { id = "m-ines", entity = "membership", group = "g-fam", user = "ines", rev = 2, fields = { role = "owner" } },
  { id = "m-tom", entity = "membership", group = "g-fam", user = "tom", rev = 6, fields = { role = "member" } },
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Shop replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";hrs", body = "Open 9 to 5." } },
  { id = "sh1", entity = "folder_share", folder = "f1", group = "g-fam", rev = 7, fields = { permission = "edit" } },
  { id = "gf1", entity = "folder", profile = "g-fam", rev = 8, fields = { name = "Family", member_permission = "edit" } },
  { id = "gs1", entity = "snippet", folder = "gf1", rev = 9, fields = { abbreviation = ";wifi", body = "The guest network is Millrace." } },
]

[[scenario.step]]
at = "C"
do = "offline"

[[scenario.step]]
id = "c1"
at = "C"
do = "edit"
row = "s1"
fields = { body = "Open 9 to 6." }

[[scenario.step]]
id = "c2"
at = "C"
do = "edit"
row = "gs1"
fields = { body = "The guest network is Millrace-Guest." }

[[scenario.step]]
id = "x1"
at = "A"
do = "delete_group"
group = "g-fam"
cascade = ["m-ines", "m-tom", "sh1", "gf1", "gs1"]
answer = "ok"
note = "One transaction: the profile, its memberships, the shares into it and the folders it owns, with their content, are deleted. Every member, the owner included, gets folder_revoked for the group's folders; the members other than the folder's owner get it for the folders shared into the group."

[[scenario.step]]
at = "C"
do = "online"
note = "C pulls first: both folders are revoked, the two unsent changes are kept for the user and the folders purged (D6)."

[scenario.outcome]
summary = "The group, its own folder and the share are gone for everyone at once; no call brings a deleted group or its content back. Ines keeps her folder f1, unshared. Tom's device holds nothing of the group and keeps his two changes in the list of changes that were not synced. Each of them keeps only the tombstone of their own membership."

[scenario.outcome.server]
rows = [
  { row = "m-ines", state = "deleted", version = "x1" },
  { row = "m-tom", state = "deleted", version = "x1" },
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "start" },
  { row = "sh1", state = "deleted", version = "x1" },
  { row = "gf1", state = "deleted", version = "x1" },
  { row = "gs1", state = "deleted", version = "x1" },
]
history = [{ row = "m-ines", version = "start" }, { row = "m-tom", version = "start" }, { row = "sh1", version = "start" }, { row = "gf1", version = "start" }, { row = "gs1", version = "start" }]
conflicts = []

[scenario.outcome.device.A]

[[scenario]]
id = "S41"
title = "The answer to a push is lost and the push is sent again"
category = "transport"
covers = ["replayed-push"]
rules = ["C15", "D4"]
given = "Device A pushes an edit of s1. The server applies it, but the answer never arrives. Before A tries again, device B edits the same snippet on top of A's change."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "manual"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
at = "A"
do = "push"
answer = "lost"
note = "The server applied a1 and stored the answer under the change's id. A still holds the change in its outbox."

[[scenario.step]]
id = "b1"
at = "B"
do = "edit"
row = "s1"
fields = { body = "Thank you so much for your order." }
answers = { s1 = "applied" }
note = "B had pulled a1, so this edit is based on it: not stale."

[[scenario.step]]
at = "A"
do = "push"
answers = { s1 = "replayed" }
note = "The same change id again: the server answers what it answered the first time and writes nothing (C15). Without the stored answer this push would look stale and would replace b1."

[[scenario.step]]
at = "A"
do = "auto"
note = "A pulls b1 and applies it: nothing of its own is waiting any more."

[scenario.outcome]
summary = "a1 was applied once and b1 on top of it. The snippet has the content of b1 everywhere, with no conflict: sending a change twice never creates a second revision."

[scenario.outcome.server]
rows = [
  { row = "f1", state = "live", version = "start" },
  { row = "s1", state = "live", version = "b1" },
]
history = [{ row = "s1", version = "start" }, { row = "s1", version = "a1" }]
conflicts = []

[scenario.outcome.device.A]
same_as = "server"
shown = []

[scenario.outcome.device.B]
same_as = "server"
shown = []

[[scenario]]
id = "S42"
title = "The network delivers the same push twice"
category = "transport"
covers = ["duplicated-push"]
rules = ["C4", "C15"]
given = "Device A pushes an edit of s1 and the request reaches the server twice."

[scenario.start]
users = ["ines"]
devices = [{ id = "A", user = "ines" }, { id = "B", user = "ines" }]
profiles = [{ id = "p-ines", kind = "personal", owner = "ines" }]
rows = [
  { id = "f1", entity = "folder", profile = "p-ines", rev = 3, fields = { name = "Replies" } },
  { id = "s1", entity = "snippet", folder = "f1", rev = 5, fields = { abbreviation = ";rty", body = "Thanks for your order." } },
]

[[scenario.step]]
at = "A"
do = "manual"

[[scenario.step]]
id = "a1"
at = "A"
do = "edit"
row = "s1"
fields = { body = "Thank you for your order." }

[[scenario.step]]
at = "A"
do = "push"
fault = "duplicate"
answers = { s1 = "applied" }

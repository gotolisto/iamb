[[example]]
id = "field-25"
macro = "field"
note = "A submitted choice value that is not one of the options is replaced by the default"
template = 'Size {field name="Size" type=choice options="S|M|L" default="M"}'
ctx = { values = { Size = "XXL" } }
expect = { text = "Size M", form = [{ name = "Size", type = "choice", default = "M", options = ["S", "M", "L"] }] }

[[example]]
id = "field-26"
macro = "field"
note = "A submitted toggle value other than yes counts as unchecked (also \"Yes\")"
template = '{field name="Rush" type=toggle on="rush" off="standard"}/{field name="Gift" type=toggle on="gift" off="no gift"}'
ctx = { values = { Rush = "maybe", Gift = "Yes" } }
expect = { text = "standard/no gift", form = [{ name = "Rush", type = "toggle", default = "no" }, { name = "Gift", type = "toggle", default = "no" }] }

[[example]]
id = "field-27"
macro = "field"
note = "Line breaks in a submitted single-line text value become spaces (CRLF and CR count as one)"
template = 'Re: {field name="Subject"}'
ctx = { values = { Subject = "one\r\ntwo\rthree\nfour" } }
expect = { text = "Re: one two three four", form = [{ name = "Subject", type = "text", default = "" }] }

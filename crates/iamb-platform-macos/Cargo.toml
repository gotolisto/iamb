[package]
name = "iamb-platform-macos"
description = "macOS implementations of the Iamb platform traits. An empty crate on every other system."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
# `probe`: the probe window of the end-to-end latency measurement (docs/test-strategy.md §6),
# the public module `probe` (an `NSTextView` window). Test tooling for `iamb-probe` in
# iamb-testkit: off by default and never enabled by a shipped binary (the service is built on
# its own, without it). It only turns on more AppKit classes of the bindings already listed.
probe = [
    "objc2-app-kit/NSGraphics",
    "objc2-app-kit/NSText",
    "objc2-app-kit/NSTextView",
    "objc2-app-kit/NSView",
    "objc2-app-kit/NSWindow",
]
# `panel`: `make_non_activating_panel`, which turns a window of the UI host into a
# non-activating panel (ADR-0017; `src/panel.rs`). Only iamb-desktop enables it: the service
# links this crate without it, so neither `raw-window-handle` nor the panel code is in the
# service binary and its imports stay as they are (ADR-0008, CI "Service binary imports").
panel = [
    "dep:raw-window-handle",
    "objc2-app-kit/NSPanel",
    "objc2-app-kit/NSView",
    "objc2-app-kit/NSWindow",
]

# `run_with_main_loop` must be called on the process's main thread, which the standard test
# harness keeps for itself; this test brings its own `main`.
[[test]]
name = "main_loop"
path = "tests/main_loop.rs"
harness = false

# The focus tests need the main thread too: the secure-entry flag is read there, the
# activation notification arrives there, and the test's window lives there.
[[test]]
name = "focus"
path = "tests/focus.rs"
harness = false

# Session events arrive on the main run loop, which this test runs itself.
[[test]]
name = "session"
path = "tests/session.rs"
harness = false

# Opens the probe window and types into it; needs the main thread and an interactive session
# (skipped with a `SKIPPED` line without one).
[[test]]
name = "probe"
path = "tests/probe.rs"
harness = false
required-features = ["probe"]

# Converts a window into the non-activating panel on the main thread, which runs the
# application event loop (skipped checks write `SKIPPED` without a window server session).
[[test]]
name = "panel"
path = "tests/panel.rs"
harness = false
required-features = ["panel"]

# These tables repeat [workspace.lints] from the root Cargo.toml, because a crate cannot
# inherit the workspace lints and override one of them. The only differences: `unsafe_code`
# is allowed (this crate and iamb-platform-windows are the two places where it may be,
# architecture §2), and in exchange every `unsafe` block must carry a `// SAFETY:` comment
# and an `unsafe fn` gets no implicit unsafe block.
# `crates/iamb-platform/tests/lints.rs` fails when this copy and the workspace drift apart.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"

[dependencies]
iamb-platform = { path = "../iamb-platform" }

# One family of bindings generated from the system headers, with default features off and
# only the types the modules in `src/` need (see the crate docs for why this family). None of
# these crates has a build script that needs the macOS SDK, so the crate type-checks from
# Linux. No networking framework may ever be added: this crate is linked into iamb-service
# (architecture §2, ADR-0008).
#
#   objc2, objc2-foundation        everything that talks to Objective-C classes; session
#                                  (the distributed notification centre)
#   objc2-core-foundation          listener (run loop, mach port), every CF type
#   objc2-core-graphics            listener (event tap), injector (event source, posting),
#                                  permissions (Input Monitoring), focus (window ids)
#   objc2-application-services     focus and permissions (the Accessibility API; `libc` for
#                                  the process id of an application's element and observer)
#   objc2-app-kit                  clipboard (pasteboard), focus (frontmost application and
#                                  its activation; `libc` for its process id),
#                                  session (the workspace's session notifications),
#                                  main_loop (the application event loop; `NSGraphicsContext`
#                                  only for the signature of the event that stops it),
#                                  panel (feature `panel`: `NSPanel`, `NSView`, `NSWindow`)
#   objc2-service-management       login_item
#   objc2-security                 endpoint (code signature of the peer)
#   libc                           memory (mlock), endpoint (peer credentials, modes)
#   raw-window-handle              panel (feature `panel`): the window handle a Tauri window
#                                  gives; the version Tauri uses
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
raw-window-handle = { version = "0.6.2", optional = true, default-features = false, features = ["std"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSApplication",
    "NSEvent",
    "NSGraphicsContext",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "AXAttributeConstants",
    "AXConstants",
    "AXError",
    "AXNotificationConstants",
    "AXRoleConstants",
    "AXUIElement",
    "AXValue",
    "AXValueConstants",
    "HIServices",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFBase",
    "CFCGTypes",
    "CFData",
    "CFDate",
    "CFDictionary",
    "CFMachPort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
    "CFURL",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "CGError",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSDictionary",
    "NSDistributedNotificationCenter",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSURL",
    "NSValue",
] }
objc2-security = { version = "0.3.2", default-features = false, features = [
    "std",
    "CSCommon",
    "SecBase",
    "SecCode",
    "SecRequirement",
    "SecStaticCode",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "SMAppService",
    "SMErrors",
    "objc2",
    "objc2-foundation",
] }

# Only `tests/focus.rs` needs these: a window with a plain and a password field to inspect.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSControl",
    "NSGraphics",
    "NSSecureTextField",
    "NSTextField",
    "NSView",
    "NSWindow",
] }

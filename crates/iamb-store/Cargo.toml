[package]
name = "iamb-store"
description = "Local SQLite store, import and export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# base64: attachment bytes inside a JSON library file (`transfer`). sha2: the content address of
# an attachment (`attachments`). Both RustCrypto/MIT-or-Apache, already in the lock file.
base64 = "0.23.1"
csv = "1.4.0"
iamb-core = { path = "../iamb-core" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

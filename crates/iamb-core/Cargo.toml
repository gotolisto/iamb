[package]
name = "iamb-core"
description = "Pure engine: data model, matcher, template language, date math. No I/O, no OS code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Markdown for rich snippets (`rich`, task 3.8): a pull parser, pure (no I/O), MIT; the HTML
# is written by `rich` itself, so the crate's own HTML writer is left out.
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"
toml = "1.2.1"

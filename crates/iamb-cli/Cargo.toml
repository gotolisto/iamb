[package]
name = "iamb-cli"
description = "Command-line interface for Iamb, a free and open-source text expander."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "iamb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
iamb-core = { path = "../iamb-core" }
iamb-store = { path = "../iamb-store" }

[dev-dependencies]
iamb-store = { path = "../iamb-store" }
tempfile = "3.27.0"

[lints]
workspace = true

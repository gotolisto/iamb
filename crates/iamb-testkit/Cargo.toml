[package]
name = "iamb-testkit"
description = "Test-only helpers: a fake environment, scripted typing sessions for the engine, the compatibility-matrix harness and the soak harness with its canary privacy scan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# The compatibility harness (task 2.7): walks the owner through the 20-app matrix on a real
# machine. Never shipped.
[[bin]]
name = "iamb-compat"
path = "src/bin/iamb_compat.rs"

# The soak harness (task 2.6) and the canary privacy scan (task 2.5): drives the service's
# supervisor and worker on the mock platform for minutes to days. Never shipped.
# The probe window of the end-to-end latency measurement (task 2.7): one text control that
# times expansions for `iamb-compat latency`. Its native window lives in the two OS crates
# behind their `probe` feature, which this crate's `probe` feature turns on. Never shipped.
[[bin]]
name = "iamb-probe"
path = "src/bin/iamb_probe.rs"
required-features = ["probe"]

[[bin]]
name = "iamb-soak"
path = "src/bin/iamb_soak.rs"
required-features = ["soak"]

# `iamb-probe --browser` end to end with a simulated page; runs on every system.
[[test]]
name = "probe_browser"
path = "tests/probe_browser.rs"
required-features = ["probe"]

[lints]
workspace = true

[features]
# `store` lets `iamb-compat setup` import the fixture library through `iamb-store` (which bundles
# SQLite, a C build). Cross-checking this crate for another OS from Linux needs
# `--no-default-features --lib --bins`, because the C build wants that OS's tools.
default = ["store", "soak"]
store = ["dep:iamb-store"]
# `soak` builds `iamb_testkit::soak` and the `iamb-soak` binary on top of the service's library
# (its supervisor and worker); it adds no feature to `iamb-service` itself.
soak = ["store", "dep:iamb-service", "dep:iamb-ipc"]
# `probe` builds the `iamb-probe` binary with the native probe window of the OS crates. Off by
# default, so that no build that also contains a shipped binary turns on the OS crates'
# `probe` feature (`cargo build -p iamb-testkit --features probe --bin iamb-probe`).
probe = ["iamb-platform-windows/probe", "iamb-platform-macos/probe"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
iamb-bench = { path = "../iamb-bench" }
iamb-core = { path = "../iamb-core" }
iamb-ipc = { path = "../iamb-ipc", optional = true }
iamb-platform = { path = "../iamb-platform" }
iamb-service = { path = "../iamb-service", optional = true }
iamb-store = { path = "../iamb-store", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

# The clipboard of the real machine. These crates are empty on every other system.
[target.'cfg(windows)'.dependencies]
iamb-platform-windows = { path = "../iamb-platform-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
iamb-platform-macos = { path = "../iamb-platform-macos" }

[dev-dependencies]
# The scenario replay of task 4.4 (`tests/sync_replay.rs`): the real store and agent against the
# model of the server.
iamb-sync = { path = "../iamb-sync", features = ["model"] }
# The dry-run expansion of `iamb expand`, so a test checks the fixtures through the same code.
iamb-cli = { path = "../iamb-cli" }
tempfile = "3.27.0"

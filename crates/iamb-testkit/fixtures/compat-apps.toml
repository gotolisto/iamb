# The compatibility matrix's app list (task 2.7): one source for `iamb-compat`.
# `docs/compatibility-matrix.md` section 1 is the reference; a test keeps the two in step
# (ids, names and surfaces, rich flags, secure rows). Edit both together.
#
# os      windows | macos
# rich    T5 is checked for bold, link and image structure (a rich surface)
# secure  password field: nothing may expand, nothing may be buffered
# auto    the harness may type and read back by itself (false: terminals, password fields)
# single_line  a one-line field: newlines are dropped from T2
# extra   an extra check to do once on this row, not a cell

[[app]]
id = "W1"
os = "windows"
name = "Notepad"
surface = "Document body"
rich = false
secure = false
auto = true
notes = "Autosave and tabs; reference row, should always pass"

[[app]]
id = "W2"
os = "windows"
name = "Google Chrome"
surface = "Local test page: <textarea>"
rich = false
secure = false
auto = true
notes = "Synthesised Unicode input works; autofill pop-ups can steal arrow keys"

[[app]]
id = "W3"
os = "windows"
name = "Mozilla Firefox"
surface = "Local test page: contenteditable div"
rich = false
secure = false
auto = true
notes = "Different Unicode key handling from Chromium; check emoji surrogate pairs"

[[app]]
id = "W4"
os = "windows"
name = "Microsoft Edge"
surface = "Gmail compose body"
rich = true
secure = false
auto = true
notes = "Web editor re-renders on input; fast key bursts can reorder; paste path preferred for long text"

[[app]]
id = "W5"
os = "windows"
name = "Google Chrome"
surface = "Google Docs document body"
rich = true
secure = false
auto = true
notes = "Own editing surface; ignores some synthetic events; caret moves need key presses, not caret APIs"

[[app]]

description = "By default Enter and Tab end a word without expanding it: the application acts on them first (review 2.8, finding 1)"

[[snippet]]
abbr = "brb"
body = "be right back"

[[step]]
type = "brb"

[[step]]
key = "enter"
expect = []
buffered = 0

[[step]]
type = "brb"

[[step]]
key = "tab"
expect = []
buffered = 0

[[step]]
type = "brb "
expect = [{ delete = 4 }, { text = "be right back" }, { text = " " }, { expanded = "brb" }]

description = "Typing the abbreviation again offers the last values"

[[snippet]]
abbr = "dear"
body = 'Dear {field name="Name"},'

[[step]]
type = "dear "
expect = [{ form = "dear" }]

[[step]]
submit = { Name = "Kim" }
expect = [{ delete = 5 }, { text = "Dear Kim,", verbatim = [[5, 8]] }, { text = " " }, { expanded = "dear" }]

[[step]]
type = "dear "
expect = [{ form = "dear", last_values = { Name = "Kim" } }]

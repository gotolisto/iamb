description = "A palette pick never types into a field already known to be secure: it is refused with a diagnostic"

[[snippet]]
abbr = "brb"
body = "be right back"

[[step]]
focus = "vault"

[[step]]
secure = "secure"
expect = [{ diagnostic = "suspended_secure_field", app = "vault" }]

[[step]]
expand = "brb"
expect = [{ diagnostic = "refused_secure_field", snippet = "brb", app = "vault" }]
held = false
state = "idle"

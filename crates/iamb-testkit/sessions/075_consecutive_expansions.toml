description = "The delimiter typed again lets the next abbreviation start a word"

[[snippet]]
abbr = "brb"
body = "be right back"

[[snippet]]
abbr = "omw"
body = "on my way"

[[step]]
type = "brb "
expect = [{ delete = 4 }, { text = "be right back" }, { text = " " }, { expanded = "brb" }]
buffered = 0

[[step]]
type = "omw."
expect = [{ delete = 4 }, { text = "on my way" }, { text = "." }, { expanded = "omw" }]

[[step]]
type = "brb "
expect = [{ delete = 4 }, { text = "be right back" }, { text = " " }, { expanded = "brb" }]

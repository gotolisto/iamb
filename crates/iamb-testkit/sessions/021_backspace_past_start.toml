description = "Backspace past the start of the buffer deletes a character the buffer never held: what precedes the caret is unknown, so a word-start abbreviation fires only after a boundary"

[[snippet]]
abbr = "brb"
body = "be right back"

[[step]]
type = "br"

[[step]]
backspace = 5
buffered = 0

[[step]]
type = "brb "

[[step]]
type = "brb "
expect = [{ delete = 4 }, { text = "be right back" }, { text = " " }, { expanded = "brb" }]

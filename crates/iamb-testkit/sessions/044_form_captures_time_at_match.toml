description = "Dates reflect the moment the abbreviation was typed, not the submit"

[env]
now = "2026-03-18T14:05:09"

[[snippet]]
abbr = "ts"
body = '{field name="Who"} at {time} on {date}'

[[step]]
type = "ts "
expect = [{ form = "ts" }]

[[step]]
set_now = "2026-03-19T09:00:00"

[[step]]
submit = { Who = "me" }
expect = [{ delete = 3 }, { text = "me at 14:05 on 2026-03-18", verbatim = [[0, 2]] }, { text = " " }, { expanded = "ts" }]
now_calls = 1

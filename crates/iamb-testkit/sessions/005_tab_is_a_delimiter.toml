description = "With Tab added to the delimiters, tab counts as the delimiter tab before it clears; it is pressed again"

[settings]
delimiters = " .\n\t"

[[snippet]]
abbr = "brb"
body = "be right back"

[[step]]
type = "brb"

[[step]]
key = "tab"
expect = [{ delete = 4 }, { text = "be right back" }, { key = "tab" }, { expanded = "brb" }]

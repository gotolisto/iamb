description = "A render error emits only a diagnostic: nothing is deleted and the buffer is cleared"

[[snippet]]
abbr = "brb"
body = "be right back"

[[snippet]]
abbr = "far"
body = '{date shift="+9999y"}'

[[step]]
type = "far "
expect = [{ diagnostic = "E_DATE_RANGE", snippet = "far" }]
buffered = 0
state = "idle"

[[step]]
type = "brb "
expect = [{ delete = 4 }, { text = "be right back" }, { text = " " }, { expanded = "brb" }]

description = "Punctuation delimiters fire and are typed again"

[[snippet]]
abbr = "brb"
body = "be right back"

[[step]]
type = "brb."
expect = [{ delete = 4 }, { text = "be right back" }, { text = "." }, { expanded = "brb" }]

[[step]]
type = "brb,"
expect = [{ delete = 4 }, { text = "be right back" }, { text = "," }, { expanded = "brb" }]

[[step]]
type = "brb)"
expect = [{ delete = 4 }, { text = "be right back" }, { text = ")" }, { expanded = "brb" }]

description = "Only snippets whose template does not parse are excluded from matching; one that fails to resolve stays matchable and typing it reports the resolve error"

[[snippet]]
abbr = "brb"
body = "be right back"

[[snippet]]
abbr = "bad"
body = "{date"

[[snippet]]
abbr = "lost"
body = '{snippet abbr="nowhere"}'

[[snippet]]
abbr = "loop"
body = '{snippet abbr="loop"}'

[[snippet]]
abbr = "offbad"
body = "{date"
enabled = false

[[snippet]]
abbr = "ost"
body = "SHORTER"
word_start = false

[[excluded]]
abbr = "bad"
reason = "E_UNCLOSED_MACRO"

[[step]]
type = "bad offbad "

[[step]]
type = "lost "
expect = [{ diagnostic = "E_SNIPPET_NOT_FOUND", snippet = "lost" }]

[[step]]
type = "loop "
expect = [{ diagnostic = "E_SNIPPET_CYCLE", snippet = "loop" }]

[[step]]
type = "brb "
expect = [{ delete = 4 }, { text = "be right back" }, { text = " " }, { expanded = "brb" }]

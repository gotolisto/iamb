description = "A 64-character abbreviation with its delimiter and the character before it fit the 66-character buffer: it fires after other text, not mid-word"

[[snippet]]
abbr = "abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijkl"
body = "long"

[[step]]
type = "abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijkl "
expect = [{ delete = 65 }, { text = "long" }, { text = " " }, { expanded = "abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijkl", chars_saved = 0 }]

[[step]]
type = "xabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijkl "

[[step]]
type = "ok abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijkl "
expect = [{ delete = 65 }, { text = "long" }, { text = " " }, { expanded = "abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijkl" }]

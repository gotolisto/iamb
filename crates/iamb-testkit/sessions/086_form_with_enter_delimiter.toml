description = "A form triggered by Enter presses Enter again after submit; the submit waits for the verdict on the field focus returned to"

[[snippet]]
abbr = "dear"
body = 'Dear {field name="Name"},'

[[step]]
type = "dear"

[[step]]
key = "enter"
expect = [{ form = "dear" }]

[[step]]
focus = "iamb"

[[step]]
secure = "own_window"

[[step]]
focus = "mail"

[[step]]
submit = { Name = "Kim" }
held = true

[[step]]
secure = "normal"
expect = [{ delete = 5 }, { text = "Dear Kim,", verbatim = [[5, 8]] }, { key = "enter" }, { expanded = "dear" }]
suspended = false
held = false

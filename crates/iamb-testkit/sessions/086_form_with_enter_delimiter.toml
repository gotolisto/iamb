description = "A form triggered by Enter presses Enter again after submit"

[[snippet]]
abbr = "dear"
body = 'Dear {field name="Name"},'

[[step]]
type = "dear"

[[step]]
key = "enter"
expect = [{ form = "dear" }]

[[step]]
focus = "iamb"

[[step]]
secure = "own_window"

[[step]]
focus = "mail"

[[step]]
submit = { Name = "Kim" }
expect = [{ delete = 5 }, { text = "Dear Kim,", verbatim = [[5, 8]] }, { key = "enter" }, { expanded = "dear" }]
suspended = true

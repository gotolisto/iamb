description = "Submitting a form into a window the focus thread calls secure is refused; the values stay remembered and the form can be reopened in a normal field"

[[snippet]]
abbr = "pw"
body = '{field name="Code"}'

[[step]]
type = "pw "
expect = [{ form = "pw" }]

[[step]]
focus = "login"

[[step]]
secure = "secure"
expect = [{ diagnostic = "suspended_secure_field", app = "login" }]

[[step]]
submit = { Code = "1234" }
expect = [{ diagnostic = "refused_secure_field", snippet = "pw", app = "login" }]
form_open = false
state = "idle"

[[step]]
focus = "editor"

[[step]]
secure = "normal"

[[step]]
reopen = true
expect = [{ form = "pw", fields = ["Code"], last_values = { Code = "1234" } }]

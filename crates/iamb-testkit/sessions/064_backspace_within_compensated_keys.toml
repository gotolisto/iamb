description = "Backspaces that only undo keys typed after the trigger are compensated like the keys"
auto_inject = false

[[snippet]]
abbr = "brb"
body = "be right back"

[[snippet]]
abbr = "omw"
body = "on my way"

[[step]]
type = "brb "
expect = [{ delete = 4 }, { text = "be right back" }, { text = " " }, { expanded = "brb" }]

[[step]]
type = "oxm"

[[step]]
backspace = 1

[[step]]
backspace = 1

[[step]]
type = "m"

[[step]]
inject = "start"
buffered = 2

[[step]]
inject = "finish"

[[step]]
type = "w "
expect = [{ delete = 4 }, { text = "on my way" }, { text = " " }, { expanded = "omw" }]

description = "Nothing is matched while an expansion is in flight"
auto_inject = false

[[snippet]]
abbr = "brb"
body = "be right back"

[[snippet]]
abbr = "omw"
body = "on my way"

[[step]]
type = "brb "
expect = [{ delete = 4 }, { text = "be right back" }, { text = " " }, { expanded = "brb" }]

[[step]]
type = "omw "
buffered = 4

[[step]]
inject = "start"

[[step]]
inject = "finish"

[[step]]
type = "x"

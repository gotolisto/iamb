[package]
name = "iamb-platform-windows"
description = "Windows implementations of the Iamb platform traits. An empty crate on every other system."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
# `probe`: the probe window of the end-to-end latency measurement (docs/test-strategy.md §6),
# the public module `probe`. Test tooling for `iamb-probe` in iamb-testkit: off by default and
# never enabled by a shipped binary (the service is built on its own, without it).
probe = []

# Opens the probe window and types into it; needs an interactive desktop (IAMB_REQUIRE_DESKTOP
# turns its skip into a failure).
[[test]]
name = "probe"
path = "tests/probe.rs"
required-features = ["probe"]

# These tables repeat [workspace.lints] from the root Cargo.toml, because a crate cannot
# inherit the workspace lints and override one of them. The only differences: `unsafe_code`
# is allowed (this crate and iamb-platform-macos are the two places where it may be,
# architecture §2), and in exchange every `unsafe` block must carry a `// SAFETY:` comment
# and an `unsafe fn` gets no implicit unsafe block.
# `crates/iamb-platform/tests/lints.rs` fails when this copy and the workspace drift apart.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"

[dependencies]
iamb-platform = { path = "../iamb-platform" }

# Raw bindings only, and only the namespaces the modules in `src/` need. No namespace under
# Win32_Networking, Win32_NetworkManagement or Win32_System_RemoteDesktop may ever be added:
# this crate is linked into iamb-service, which contains no network code (architecture §2,
# ADR-0008).
#
#   Foundation                     everything (handles, BOOL, error codes)
#   Graphics_Gdi                   clipboard (an enhanced metafile copied as its records and
#                                  made again: the 2.8 follow-up review's N4)
#   UI_WindowsAndMessaging         listener (hooks, message loop), focus (foreground window)
#   UI_Input_KeyboardAndMouse      listener (layout translation), injector (SendInput), hotkeys
#   UI_Input_Ime                   listener (composition state)
#   UI_Accessibility               focus (window-event hook, UI Automation identifiers)
#   System_Com                     focus (UI Automation is reached through COM)
#   System_Diagnostics_Debug,
#   System_ErrorReporting          hardening (error mode, error-reporting flags)
#   System_LibraryLoader           listener (module handle for the hooks)
#   System_Threading               focus, endpoint (process handles, image path, tokens)
#   System_DataExchange            clipboard
#   System_Memory                  clipboard (global memory), memory (VirtualLock)
#   System_Registry                login_item (per-user Run key)
#   System_Pipes, System_IO,
#   Storage_FileSystem             endpoint (named pipe, overlapped I/O)
#   Security, Security_Authorization
#                                  endpoint (user SID, pipe security descriptor), focus
#                                  (integrity level)
#   Security_WinTrust, Security_Cryptography
#                                  endpoint (signature of the peer's executable; revocation
#                                  checks must stay off so that nothing touches the network)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ErrorReporting",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

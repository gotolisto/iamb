[package]
name = "iamb-desktop"
description = "The Iamb UI host: a Tauri 2 shell with the tray or menu-bar icon, the windows, and the bridge from the front end's commands to the service endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "iamb_desktop"
path = "src/lib.rs"

[[bin]]
name = "iamb-desktop"
path = "src/main.rs"

[lints]
workspace = true

# Architecture §2: the IPC client and the platform crates, never the engine or the store.
# `iamb-core` only for the model types that travel in messages (ids, snippets).
[dependencies]
iamb-core = { path = "../../../crates/iamb-core" }
iamb-ipc = { path = "../../../crates/iamb-ipc" }
iamb-platform = { path = "../../../crates/iamb-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "=2.12.5", features = ["tray-icon"] }

# `harden_process` (architecture §8 rule 9, "Crash handling"); Linux writes its coredump
# filter in `src/crash.rs`.
[target.'cfg(windows)'.dependencies]
iamb-platform-windows = { path = "../../../crates/iamb-platform-windows" }

[target.'cfg(target_os = "macos")'.dependencies]
iamb-platform-macos = { path = "../../../crates/iamb-platform-macos" }

# Linux (development only): the library window shares the pre-warmed panels' web process
# (`src/app/windows.rs`). The same version Tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# The crash-isolation and contract tests run a worker in-process on the mock platform.
[dev-dependencies]
iamb-service = { path = "../../../crates/iamb-service" }
iamb-store = { path = "../../../crates/iamb-store" }
tempfile = "3.27.0"

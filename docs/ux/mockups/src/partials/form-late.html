<div class="panel formp" role="dialog" aria-label="Late delivery" data-os="{{os}}"{{fixed}}>
  <div class="hd"><svg class="i" aria-hidden="true" style="color:var(--color-accent-text)"><use href="#i-iamb"/></svg><span class="ttl">Late delivery</span><span class="abbr">;rlate</span></div>
  <div class="bd">
    <div class="field"><label>First name</label><div class="input lg is-focus">Jun<span class="caret"></span></div></div>
    <div class="field"><label>Order number</label><div class="input lg"></div></div>
    <label class="check"><span class="box"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg></span><span>Add voucher</span></label>

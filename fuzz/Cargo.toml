# Fuzz targets for iamb-core (cargo-fuzz layout). Its own workspace, so the main workspace's
# `cargo build --workspace` never sees it; it is the only code built with nightly.
#
# Run (from this directory, after seeding the corpus; see README.md):
#   cargo +nightly fuzz run template corpus/template -- -timeout=1 -max_total_time=600 -rss_limit_mb=512
# (`-timeout=1`: an input that takes over a second counts as a failure.)

[package]
name = "iamb-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
iamb-core = { path = "../crates/iamb-core" }

[[bin]]
name = "template"
path = "fuzz_targets/template.rs"
test = false
doc = false
bench = false

[workspace]

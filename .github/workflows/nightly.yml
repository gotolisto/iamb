name: Nightly

# Long-running checks from docs/test-strategy.md that are too slow for every pull request:
# a 10-minute fuzz run of the template engine, the matcher mutation sample, the release-mode
# timing limits (load KPI, worst-case template budgets), and the 30-minute soak with the canary
# privacy scan (section 5).
# Report only for now; a failure shows on the run and its artifacts, and never blocks a merge.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The only nightly use in the project; bump it deliberately, in a PR that says why.
  FUZZ_TOOLCHAIN: nightly-2026-11-01

jobs:
  fuzz-template:
    name: fuzz (template, 10 min)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo "+$FUZZ_TOOLCHAIN" install cargo-fuzz --locked
      - name: Restore the corpus kept from earlier nights
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/template
          key: fuzz-corpus-template-${{ github.run_id }}
          restore-keys: fuzz-corpus-template-
      - name: Seed the corpus from the spec examples
        run: python3 -I spec/template/seed_fuzz_corpus.py fuzz/corpus/template
      - name: Fuzz for 10 minutes (no crash, no input over 1 s, no OOM over 512 MB)
        working-directory: fuzz
        run: >
          cargo "+$FUZZ_TOOLCHAIN" fuzz run template corpus/template --
          -max_total_time=600 -timeout=1 -rss_limit_mb=512
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: fuzz/artifacts/
          retention-days: 30

  mutants-matcher:
    name: mutation sample (matcher)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants
      - name: Install cargo-mutants
        run: cargo mutants --version || cargo install cargo-mutants --locked
      - name: Run the matcher sample (gate 80% of viable mutants caught)
        shell: bash
        run: |
          set -o pipefail
          cargo mutants -p iamb-core -f crates/iamb-core/src/matcher.rs \
            -f 'crates/iamb-core/src/matcher/*.rs' --timeout 120 -j 2 | tee mutants.log || true
          python3 -I - <<'PY'
          import json, sys
          o = json.load(open("mutants.out/outcomes.json"))
          counts = {}
          for x in o["outcomes"]:
              s = x["summary"]
              counts[s] = counts.get(s, 0) + 1
          caught, missed = counts.get("CaughtMutant", 0), counts.get("MissedMutant", 0)
          viable = caught + missed + counts.get("Timeout", 0)
          print(counts)
          rate = caught / viable if viable else 0
          print(f"caught {caught} of {viable} viable ({rate:.1%})")
          sys.exit(0 if rate >= 0.8 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ github.run_id }}
          path: mutants.out/
          retention-days: 30

  release-limits:
    name: release-mode timing limits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-limits
      - name: Release-mode tests (load KPI under 100 ms, worst-case budgets)
        run: cargo test --release --locked -p iamb-core -p iamb-store

  # docs/test-strategy.md section 5, CI form: the service's supervisor and worker on the mock
  # platform for 30 minutes (seeded key stream, 10,000 fixture snippets, one library edit per
  # minute, the worker hard-killed 7 times between minutes 11.5 and 18.5), then the canary scan
  # of the data root, logs, temp directory and IPC tap, and the networking-crate check that
  # stands in for the lab's packet capture. Fails on any broken pass rule or canary hit.
  soak:
    name: soak (30 min, mock platform) and canary scan
    runs-on: ubuntu-latest
    # About 8 min to build cold, 30 min of soak, under a minute to stop and scan.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: soak
      - name: Build the soak harness (release)
        run: cargo build --release --locked -p iamb-testkit --bin iamb-soak
      - name: Soak for 30 minutes, scan for canaries, check for networking crates
        run: >
          target/release/iamb-soak run --duration 30m --seed ${{ github.run_id }}
          --out target/soak/nightly --net-check .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ github.run_id }}
          # The samples, the reports and the service logs; not the canary input file.
          path: |
            target/soak/nightly/samples.jsonl
            target/soak/nightly/report.json
            target/soak/nightly/canary-scan.json
            target/soak/nightly/summary.txt
            target/soak/nightly/work/data/logs/
            target/soak/nightly/work/service-stderr.log
          if-no-files-found: warn
          retention-days: 30

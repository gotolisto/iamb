name: Bench

# Pushes to `main` and manual runs: one run of the four quick benches, report only; results are
# uploaded as an artifact (the baseline is built from 10 manual runs on `main`).
# Pull requests: two consecutive runs, then `cargo xtask bench-compare` against
# crates/iamb-bench/baselines/ci-ubuntu.jsonl. It fails the job only when the same bench is
# > 25% and more than its noise floor slower than baseline in both runs, and passes with
# "not armed yet" while that file does not exist. See docs/test-strategy.md, "Regression rule".

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Pull requests share one group so a new push cancels the old run. Manual runs each get their own
# group, so several can be started at once on `main` to measure runner spread for the baseline
# (docs/test-strategy.md §3).
concurrency:
  group: bench-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IAMB_BENCH_RUNNER: ci-ubuntu

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    # A warm-cache run of the four quick benches takes about 40 s, a whole job 1-2.5 min; two
    # runs plus the gate fit well inside this.
    timeout-minutes: 15
    env:
      # Absolute: bench binaries run in crates/iamb-bench. Pushes and manual runs keep the
      # default directory (target/bench-results); pull requests write run 1 under run-1/.
      IAMB_BENCH_RESULTS_DIR: ${{ github.workspace }}/target/bench-results${{ github.event_name == 'pull_request' && '/run-1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      # Bench steps are report-only: a crash shows as a failed step but does not fail the job.
      # On a pull request with an armed gate, the crashed bench's missing results make
      # `bench-compare` fail instead.
      - name: Matcher benchmark (quick mode)
        continue-on-error: true
        run: cargo bench -p iamb-bench --locked --bench matcher -- --quick
      - name: Template benchmark (quick mode)
        continue-on-error: true
        run: cargo bench -p iamb-bench --locked --bench template -- --quick
      - name: Store benchmark (quick mode)
        continue-on-error: true
        run: cargo bench -p iamb-bench --locked --bench store -- --quick
      - name: Engine benchmark (quick mode)
        continue-on-error: true
        run: cargo bench -p iamb-bench --locked --bench engine -- --quick
      - name: Second run of the four benches (pull requests)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          IAMB_BENCH_RESULTS_DIR: ${{ github.workspace }}/target/bench-results/run-2
        shell: bash
        run: |
          status=0
          for b in matcher template store engine; do
            cargo bench -p iamb-bench --locked --bench "$b" -- --quick || status=1
          done
          exit "$status"
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Benchmark results'
            echo '```'
            files=$(find target/bench-results -name '*.jsonl' 2>/dev/null | sort)
            if [ -n "$files" ]; then cat $files; else echo 'no results written'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Regression gate (two runs against the baseline)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: >-
          cargo xtask bench-compare
          --baseline crates/iamb-bench/baselines/ci-ubuntu.jsonl
          target/bench-results/run-1 target/bench-results/run-2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            target/bench-results/
            target/criterion/**/new/estimates.json
          if-no-files-found: warn
          retention-days: 30

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The OS crates are empty on Linux. Type-check and lint them for their own targets here
      # (no SDK needed), so a mistake shows in this job before the Windows and macOS legs of
      # `test` have finished building.
      - name: Install Windows and macOS targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
      - name: Clippy (Windows code, cross-target)
        run: cargo clippy -p iamb-platform-windows --target x86_64-pc-windows-msvc --all-targets --locked -- -D warnings
      - name: Clippy (macOS code, cross-target)
        run: cargo clippy -p iamb-platform-macos --target aarch64-apple-darwin --all-targets --locked -- -D warnings
      - name: Banned terms
        run: cargo xtask banned-terms
      - name: Template spec examples
        run: python3 spec/template/reference.py

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      # Lints the code that only exists on this OS (iamb-platform-windows, iamb-platform-macos
      # and any `cfg` branch elsewhere), tests included. Linux is linted by the `lint` job.
      # Runs even when a test failed, so one failing test does not hide lint errors.
      - name: Clippy (this OS)
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo llvm-cov --version || cargo install cargo-llvm-cov --locked
      - name: iamb-core line coverage (gate 85%)
        run: cargo llvm-cov -p iamb-core --locked --summary-only --fail-under-lines 85

  # Single required status check for branch protection.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, coverage]
    if: always()
    steps:
      - name: Require all jobs to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A required job did not succeed." >&2
              exit 1
            fi
          done

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude iamb-desktop --all-targets --locked -- -D warnings
      # The OS crates are empty on Linux. Type-check and lint them for their own targets here
      # (no SDK needed), so a mistake shows in this job before the Windows and macOS legs of
      # `test` have finished building.
      - name: Install Windows and macOS targets
        run: rustup target add x86_64-pc-windows-msvc aarch64-apple-darwin
      - name: Clippy (Windows code, cross-target)
        run: cargo clippy -p iamb-platform-windows -p iamb-ipc --target x86_64-pc-windows-msvc --all-targets --locked -- -D warnings
      - name: Clippy (macOS code, cross-target)
        run: cargo clippy -p iamb-platform-macos -p iamb-ipc --target aarch64-apple-darwin --all-targets --locked -- -D warnings
      # The probe window of the latency measurement (docs/test-strategy.md §6) is behind the
      # `probe` feature, off by default, so the steps above do not see it.
      - name: Clippy (probe window)
        run: |
          cargo clippy -p iamb-testkit --features probe --all-targets --locked -- -D warnings
          cargo clippy -p iamb-platform-windows --features probe --target x86_64-pc-windows-msvc --all-targets --locked -- -D warnings
          cargo clippy -p iamb-platform-macos --features probe --target aarch64-apple-darwin --all-targets --locked -- -D warnings
          cargo clippy -p iamb-testkit --no-default-features --features probe --lib --bins --target x86_64-pc-windows-msvc --locked -- -D warnings
          cargo clippy -p iamb-testkit --no-default-features --features probe --lib --bins --target aarch64-apple-darwin --locked -- -D warnings
      - name: Banned terms
        run: cargo xtask banned-terms
      - name: Template spec examples
        run: python3 spec/template/reference.py
      # docs/sync-design.md §12 is rendered from spec/sync/scenarios.toml; the scenarios'
      # structure and outcomes (a ledger of every change and its answer) are checked by
      # `cargo test -p iamb-testkit --test sync_scenarios`.
      - name: Sync scenarios written out
        run: python3 spec/sync/render_scenarios.py --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The UI host (`iamb-desktop`) has a job of its own, `desktop`: it needs the system web
      # view's development files on Linux and a front-end build, and its Tauri dependencies
      # would slow every leg here.
      - name: Build
        run: cargo build --workspace --exclude iamb-desktop --all-targets --locked
      # ADR-0008, check 4: the service as it ships, built on its own. In the workspace build
      # above, features that other members turn on in shared dependencies (test-only crates
      # such as iamb-testkit with `probe`) are unified into the service's dependencies; here
      # they are not, and clippy's network lint (check 3, `crates/*/clippy.toml`) runs on
      # exactly that code. On Linux the binary must import no name-resolution function.
      - name: Build the service alone (release)
        shell: bash
        run: |
          cargo build -p iamb-service --release --locked
          cargo clippy -p iamb-service --release --locked -- -D warnings
      # Follow-up review N6: the service binary imports no name-resolution or HTTP function, on
      # every OS. The import list is printed so a new import can be looked at.
      - name: Service binary imports (ADR-0008)
        shell: bash
        run: |
          rustup component add llvm-tools
          bin="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          case "$RUNNER_OS" in
            Linux)   "$bin/llvm-nm" -D -u target/release/iamb-service > imports.txt ;;
            macOS)   { "$bin/llvm-nm" -u target/release/iamb-service; "$bin/llvm-objdump" --macho --dylibs-used target/release/iamb-service; } > imports.txt ;;
            Windows) "$bin/llvm-objdump" -p target/release/iamb-service.exe > imports.txt ;;
          esac
          grep -Eio 'dll name: .*|^[[:space:]]*/.*dylib.*|^[[:space:]]*/.*framework.*' imports.txt | sort -u || true
          pattern='getaddrinfo|gethostbyname|gethostbyaddr|getnameinfo|GetAddrInfo|GetNameInfo|DnsQuery|WinHttp|InternetOpen|dnsapi\.dll|winhttp\.dll|wininet\.dll|CFNetwork|Network\.framework'
          if grep -Ei "$pattern" imports.txt; then
            echo "the service binary imports networking (ADR-0008)" >&2
            exit 1
          fi
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace --exclude iamb-desktop --locked
      # Hosted Windows runners have an interactive desktop, so keyboard tests that need one
      # must run there: IAMB_REQUIRE_DESKTOP turns their "skipped, no desktop" into a failure.
      - name: Test (Windows, desktop required)
        if: runner.os == 'Windows'
        env:
          IAMB_REQUIRE_DESKTOP: "1"
        run: cargo test --workspace --exclude iamb-desktop --locked
      # The probe (feature `probe`): its browser page end to end on every OS, and its native
      # window on Windows (desktop required) and macOS (skipped without a window in front).
      - name: Test (probe)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test -p iamb-testkit --features probe --locked --test probe_browser
          case "$RUNNER_OS" in
            Windows) IAMB_REQUIRE_DESKTOP=1 cargo test -p iamb-platform-windows --features probe --locked --test probe ;;
            macOS) cargo test -p iamb-platform-macos --features probe --locked --test probe ;;
          esac
      # Lints the code that only exists on this OS (iamb-platform-windows, iamb-platform-macos
      # and any `cfg` branch elsewhere), tests included. Linux is linted by the `lint` job.
      # Runs even when a test failed, so one failing test does not hide lint errors.
      - name: Clippy (this OS)
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: cargo clippy --workspace --exclude iamb-desktop --all-targets --locked -- -D warnings

  # The UI host (apps/desktop, docs/test-strategy.md §8): the front end and the Rust crate on
  # every OS, and the cold-open measurement. The other jobs leave the crate out.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      # Tauri 2 on Linux: the WebKitGTK web view, the tray (application indicator), SVG icons,
      # the menu's key emulation; Xvfb for the cold-open measurement.
      - name: Install the web view and tray libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Front end (install, typecheck, unit tests, build)
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      # Paste fidelity (task 3.8, docs/paste-fidelity.md): every fixture's clipboard content, as
      # `crates/iamb-service/tests/paste_fidelity.rs` keeps it current, pasted into a rich-text
      # editor and a plain text field of the runner's Google Chrome, headless.
      - name: Paste fidelity (headless browser round trip)
        if: runner.os == 'Linux'
        working-directory: docs/paste-fidelity
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          node browser-paste.mjs
      # Accessibility, keyboard only (task 3.11, docs/accessibility-run.md): the built front end in
      # the runner's Chrome over a mocked command layer, walked with the keyboard in the light and
      # dark themes, with reduced motion and with forced colours; the focus ring is checked at
      # every step and axe-core (contrast included) must find nothing critical or serious.
      - name: Keyboard-only run (headless browser)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          (cd "$RUNNER_TEMP/pw" && npm install --no-save --no-package-lock playwright@1.63.0)
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright" node scripts/keyboard-run.mjs
      # `tauri/custom-protocol` embeds the built front end as a release does. The tests do not
      # need it; one feature set for every step builds the crate once.
      - name: Build
        run: cargo build -p iamb-desktop --all-targets --locked --features tauri/custom-protocol
      - name: Clippy
        run: cargo clippy -p iamb-desktop --all-targets --locked --features tauri/custom-protocol -- -D warnings
      - name: Test
        run: cargo test -p iamb-desktop --locked --features tauri/custom-protocol
      # The cold-open KPI (docs/test-strategy.md §8.1): Linux under Xvfb is held to the KPI's
      # 400 ms; Windows and macOS print their numbers for the record (a runner's desktop is not
      # the lab's machine) and do not fail the job.
      - name: Cold open of the library window
        if: ${{ !cancelled() }}
        continue-on-error: ${{ runner.os != 'Linux' }}
        timeout-minutes: 3
        run: |
          exe=target/debug/iamb-desktop
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          data="$RUNNER_TEMP/iamb-cold-open"
          if [ "$RUNNER_OS" = Linux ]; then
            # One untimed launch first: on a fresh runner Mesa's software renderer compiles its
            # shaders during the first paint of the first window that paints (1-2 s, cached in
            # ~/.cache/mesa_shader_cache), a cost of the virtual display only (§8.1).
            xvfb-run -a "$exe" --data-dir "$RUNNER_TEMP/iamb-warm-up" --measure-open 1 > /dev/null || true
            xvfb-run -a "$exe" --data-dir "$data" --measure-open 10 --budget-ms 800
          else
            "$exe" --data-dir "$data" --measure-open 10
          fi
      # The fill-in form KPI (docs/test-strategy.md §8.5): from `FormRequested` reaching the UI
      # host to the panel's first paint. Linux under Xvfb is gated at 300 ms, twice the 150 ms
      # target (§2.2); Windows and macOS report only.
      - name: Fill-in form visible
        if: ${{ !cancelled() }}
        continue-on-error: ${{ runner.os != 'Linux' }}
        timeout-minutes: 3
        run: |
          exe=target/debug/iamb-desktop
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          data="$RUNNER_TEMP/iamb-form-open"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a "$exe" --data-dir "$data" --measure-form 10 --budget-ms 300
          else
            "$exe" --data-dir "$data" --measure-form 10
          fi
      # The search palette KPI (docs/test-strategy.md §8.7): from `PaletteRequested` reaching the UI
      # host to the panel's first paint. Linux under Xvfb is gated at 200 ms, twice the 100 ms
      # target (§2.2); Windows and macOS report only.
      - name: Search palette visible
        if: ${{ !cancelled() }}
        continue-on-error: ${{ runner.os != 'Linux' }}
        timeout-minutes: 3
        run: |
          exe=target/debug/iamb-desktop
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          data="$RUNNER_TEMP/iamb-palette-open"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a "$exe" --data-dir "$data" --measure-palette 10 --budget-ms 200
          else
            "$exe" --data-dir "$data" --measure-palette 10
          fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo llvm-cov --version || cargo install cargo-llvm-cov --locked
      - name: iamb-core line coverage (gate 85%)
        run: cargo llvm-cov -p iamb-core --locked --summary-only --fail-under-lines 85

  # The server's schema, policies and functions (server/README.md): the policy tests against a
  # local Postgres with a stand-in for the platform's auth, storage and realtime schemas, the
  # restore test, the two-connection concurrency tests and the log check. Linux only: the tests
  # exercise SQL, not the operating system.
  server:
    name: server (policy tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-contrib
      - name: Policy tests
        run: server/tests/run.sh

  # Single required status check for branch protection.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, coverage, desktop, server]
    if: always()
    steps:
      - name: Require all jobs to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "A required job did not succeed." >&2
              exit 1
            fi
          done
